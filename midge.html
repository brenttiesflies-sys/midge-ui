<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>MIDGE — FlyVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<!-- Mapbox GL JS — loaded eagerly so renderMap() can fire synchronously
     when an artifact arrives. Cheap if the page never renders a map. -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<style>
  /* ───────── Brand tokens (halo gradient stops) ───────── */
  :root {
    --halo-1: #8ec5a4;
    --halo-2: #c9a87a;
    --halo-3: #7faec0;
    --halo-4: #c98a7a;
    --halo-5: #b59ec4;
    --halo-6: #d4b88a;
  }

  /* Dark theme tokens (default) */
  body.dark {
    --bg:        #0b0b0d;
    --bg-elev:   #14141a;
    --bg-soft:   #1c1c24;
    --text:      #e9e8e3;
    --text-soft: #9a9994;
    --text-faint:#5a5953;
    --border:    #25252e;
    --accent:    #c9a87a;
    --user-bubble: #1f1f28;
    --disc:      #14141a;
    --halo-opacity: 0.6;
  }

  /* Light theme tokens */
  body.light {
    --bg:        #f6f3ee;
    --bg-elev:   #ffffff;
    --bg-soft:   #efeae2;
    --text:      #16140f;
    --text-soft: #5e5b53;
    --text-faint:#a09c92;
    --border:    #e6dfd2;
    --accent:    #7a5a3a;
    --user-bubble: #ece5d6;
    --disc:      #ffffff;
    --halo-opacity: 0.75;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .wrap {
    height: 100dvh;       /* dynamic vh — handles mobile keyboard */
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    padding: 0;
  }

  /* ───────── Header bar ───────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    z-index: 10;
  }

  /* When hand=right (default), .left holds back-button, .right holds menu */
  /* When hand=left, the flex order is reversed via body.hand-left class */
  body.hand-left header { flex-direction: row-reverse; }

  .back-vault {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .back-vault:hover {
    color: var(--text);
    border-color: var(--text-soft);
  }
  .vault-door {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 4px, var(--accent) 4px 5px, transparent 5px 7px, var(--accent) 7px 8px, transparent 8px);
    border: 1.5px solid var(--accent);
    position: relative;
    flex-shrink: 0;
  }
  .vault-door::after {
    content: "";
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
  }

  .menu-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  .menu-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
  }

  /* ───────── Main canvas ───────── */
  main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 18px;
    -webkit-overflow-scrolling: touch;
  }

  /* Welcome state */
  .welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .welcome.hidden { display: none; }

  .logo-wrap {
    position: relative;
    width: 168px;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  /* Halo: steady rotating gradient ring */
  .halo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 2px;
    background: conic-gradient(
      from 0deg,
      var(--halo-1),
      var(--halo-2),
      var(--halo-3),
      var(--halo-4),
      var(--halo-5),
      var(--halo-6),
      var(--halo-1)
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: var(--halo-opacity);
    animation: spin 24s linear infinite;
  }
  .halo::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: inherit;
    filter: blur(12px);
    opacity: 0.45;
    z-index: -1;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  body.halo-off .halo { display: none; }

  .logo-disc {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: var(--disc);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-disc img {
    width: 92px;
    height: 92px;
    object-fit: contain;
  }

  .welcome h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: 0.2px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .welcome .sub {
    color: var(--text-soft);
    font-size: 14px;
    margin-bottom: 22px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 520px;
    margin: 0 auto;
  }
  .chip {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .chip:hover { border-color: var(--accent); }

  /* Conversation state */
  .log {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .log.hidden { display: none; }

  .msg {
    padding: 12px 14px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 15px;
    max-width: 92%;
    border: 1px solid var(--border);
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--user-bubble);
    align-self: flex-end;
  }
  .msg.midge {
    background: var(--bg-elev);
    align-self: flex-start;
  }
  .msg img {
    max-width: 100%;
    border-radius: 8px;
    margin: 8px 0;
    display: block;
  }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg strong { color: var(--accent); }
  .pending { color: var(--text-faint); font-style: italic; }
  .err { color: #e08a5a; font-size: 13px; }

  /* ───────── Composer ───────── */
  footer {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  form#composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea#q {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    resize: none;
    min-height: 46px;
    max-height: 140px;
    outline: none;
  }
  textarea#q:focus { border-color: var(--accent); }
  button#send {
    background: var(--accent);
    border: none;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    padding: 0 18px;
    height: 46px;
    border-radius: 12px;
    cursor: pointer;
  }
  body.light button#send { color: #fff; }
  button#send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ───────── Menu drawer ───────── */
  .drawer {
    position: fixed;
    top: 60px;
    right: 14px;
    width: min(320px, calc(100vw - 28px));
    max-height: calc(100dvh - 80px);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    overflow-y: auto;
    z-index: 50;
    transform: translateY(-8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  body.hand-left .drawer {
    right: auto;
    left: 14px;
  }
  .drawer.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .drawer-header {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    padding: 16px 18px 10px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .drawer-section { padding: 6px 0; }
  .drawer-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 14px;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 18px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
    color: var(--text);
  }
  .drawer-item:hover { background: var(--bg-soft); }
  .drawer-item .label { font-size: 14px; font-weight: 500; }
  .drawer-item .ctrl  { font-size: 12px; color: var(--text-soft); display: flex; align-items: center; gap: 8px; }

  /* Color swatch: wraps a real <input type="color"> so taps go straight
     to the native picker. The visible swatch is a sibling div sized to
     match. Avoids the cross-browser pain of trying to .click() a hidden input. */
  .swatch-wrap {
    position: relative;
    width: 26px;
    height: 26px;
  }
  .swatch-wrap input[type="color"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
    background: transparent;
    z-index: 2;
  }
  .swatch {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--border);
    pointer-events: none;     /* taps fall through to the input above */
    z-index: 1;
  }

  /* Toggle pill (L—R, halo on/off, light/dark) */
  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px;
    gap: 0;
    font-size: 12px;
    font-weight: 600;
  }
  .pill button {
    border: none;
    background: transparent;
    color: var(--text-faint);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    min-width: 30px;
  }
  .pill button.on {
    background: #6fae7d;
    color: #fff;
  }

  /* Logo picker (3 small previews) */
  .logo-picker {
    display: flex;
    gap: 8px;
  }
  .logo-opt {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .logo-opt.on { border-color: var(--accent); }
  .logo-opt img { width: 18px; height: 18px; object-fit: contain; }

  /* Reset button row */
  .reset-row {
    padding: 12px 18px 16px;
  }
  .reset-row button {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .reset-row button:hover { border-color: var(--accent); color: var(--accent); }

  /* ───────── Training modal ───────── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
    padding: 20px;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 22px 18px;
    max-width: 360px;
    width: 100%;
    position: relative;
    color: var(--text);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    margin-bottom: 8px;
    padding-right: 30px;
  }
  .modal p {
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.5;
  }
  .modal .x {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    border-radius: 8px;
    line-height: 1;
  }
  .modal .x:hover { background: var(--bg-soft); color: var(--text); }

  /* ── Inline artifacts: conditions card + Mapbox map ──────────── */
  .artifact {
    margin: 12px 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-soft);
    overflow: hidden;
  }
  .artifact-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .artifact-loc { font-weight: 600; font-size: 14px; }
  .artifact-asof { font-size: 11px; color: var(--text-soft); }

  /* Conditions card */
  .cond-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    padding: 12px 14px;
  }
  .cond-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .cond-cell .label {
    font-size: 11px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .cond-cell .value {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.1;
  }
  .cond-cell .sub {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 3px;
  }
  .cond-trend-up::after   { content: " ↑"; color: #2dba4e; }
  .cond-trend-down::after { content: " ↓"; color: #d63838; }
  .cond-trend-steady::after { content: " →"; color: var(--text-soft); }
  .cond-missing {
    padding: 8px 14px 12px;
    font-size: 11px;
    color: var(--text-soft);
    font-style: italic;
  }

  /* Map */
  .map-wrap { padding: 0; position: relative; }
  .midge-map {
    width: 100%;
    height: 260px;
    background: #1a1f1d;
  }

  /* Brookie banner that sits as its OWN row between the conditions-
     header strip and the map. Mirrors the card hero treatment (art
     fades into card body) but here we keep the banner above the map
     entirely — no overlap, no obscured tiles. Top-down fade INTO the
     map below makes the transition feel like one continuous visual
     instead of a stamp on top. FlyVault logo tucks into the corner.
     Routes through mv2GetCardArt() so Phase H/I/J skin changes apply
     here too. */
  .mv2-map-banner {
    position: relative;
    width: 100%;
    height: 76px;
    overflow: hidden;
    pointer-events: none;
  }
  .mv2-map-banner img.bg {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Bottom-edge fade INTO the map-tile color so the banner reads as
     melting down into the map, not stamped on top. Mapbox outdoors-v12
     light fields aren't a single flat color, so the fade trails off
     into transparency rather than trying to match a tile color. */
  .mv2-map-banner::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(26, 33, 46, 0.00) 0%,
      rgba(26, 33, 46, 0.00) 55%,
      rgba(26, 33, 46, 0.30) 80%,
      rgba(26, 33, 46, 0.65) 100%);
    pointer-events: none;
  }
  .mv2-map-banner .fv-wrap {
    position: absolute;
    top: 4px; right: 8px;
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .mv2-map-banner .fv-wrap img {
    width: 48px; height: 48px;
    filter: brightness(0) saturate(100%) contrast(1000%)
            drop-shadow(0 1px 0 #000)
            drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }
  .map-overlays {
    padding: 8px 14px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
  }
  .map-overlay-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11px;
    cursor: pointer;
    line-height: 1.2;
  }
  .map-overlay-toggle.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .map-error {
    padding: 14px;
    font-size: 12px;
    color: var(--text-soft);
  }

  /* Mobile narrowing */
  @media (max-width: 540px) {
    .welcome h1 { font-size: 22px; }
    .chip { font-size: 12px; padding: 7px 12px; }
    .drawer { top: 56px; }
    .midge-map { height: 220px; }
    .cond-grid { grid-template-columns: 1fr 1fr; }
  }

  /* ───────────────────────────────────────────────────────────────
     v6 Cards (Phase B)
     Hero-left + brookie-flank-right with gradient blend. FlyVault
     logo in the bottom-right of the art. On expand, art slides up
     to a thin header band, hero scales to full width, expanded
     panel reveals below. Each card has a 3px colored top stripe.
     All selectors are namespaced under .mv2-* so they don't clash
     with the existing .cond-cell / .artifact / .midge-map styles.
     The v6 design is HARDCODED (dark colors only) — it doesn't
     bind to --bg / --text vars. This is intentional: the locked
     design IS the dark-mode look.
     ─────────────────────────────────────────────────────────── */

  .mv2-stack { display: flex; flex-direction: column; gap: 12px;
               margin-top: 10px; }

  .mv2-card {
    background: #1a212e;
    border: 1px solid #2a3447;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 160ms, box-shadow 160ms;
    user-select: none;
    min-height: 168px;
  }
  .mv2-card:hover { border-color: #3a4863; }

  /* 3px colored top stripe per card type */
  .mv2-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; z-index: 5;
  }
  .mv2-card.water::before   { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
  .mv2-card.weather::before { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .mv2-card.astro::before   { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }
  .mv2-card.radar::before   { background: linear-gradient(90deg, #10b981, #059669); }

  /* Brookie flank art region — right two-thirds when collapsed,
     full-width header band when expanded. */
  .mv2-art {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 62%;
    overflow: hidden;
    pointer-events: none;
    transition: width 480ms cubic-bezier(0.22, 1, 0.36, 1),
                height 480ms cubic-bezier(0.22, 1, 0.36, 1),
                top 480ms cubic-bezier(0.22, 1, 0.36, 1),
                bottom 480ms cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
    opacity: 0.92;
  }
  .mv2-card.open .mv2-art {
    top: 0; right: 0; bottom: auto;
    width: 100%; height: 88px;
  }
  .mv2-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Gradient blend overlay — softened multi-stop so the art→card-body
     transition reads as continuous, not banded. */
  .mv2-art::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to right,
      #1a212e 0%,
      rgba(26, 33, 46, 0.98) 8%,
      rgba(26, 33, 46, 0.88) 18%,
      rgba(26, 33, 46, 0.70) 30%,
      rgba(26, 33, 46, 0.45) 45%,
      rgba(26, 33, 46, 0.22) 62%,
      rgba(26, 33, 46, 0.08) 80%,
      transparent 100%);
    transition: background 480ms cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 2;
  }
  /* Vignette so the art doesn't hard-crop at the card border */
  .mv2-art::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(26,33,46,0.35) 0%, transparent 12%, transparent 88%, rgba(26,33,46,0.35) 100%),
      linear-gradient(to left,   rgba(26,33,46,0.25) 0%, transparent 8%);
    pointer-events: none;
    z-index: 2;
    transition: background 480ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mv2-card.open .mv2-art::before {
    background: linear-gradient(to bottom,
      transparent 0%, transparent 35%,
      rgba(26, 33, 46, 0.30) 60%,
      rgba(26, 33, 46, 0.75) 85%,
      #1a212e 100%);
  }
  .mv2-card.open .mv2-art::after {
    background: linear-gradient(to right,
      rgba(26,33,46,0.20) 0%, transparent 6%, transparent 94%, rgba(26,33,46,0.20) 100%);
  }

  /* FlyVault logo — bottom-right of art collapsed, top-right band expanded.
     Solid black silhouette via brightness(0) filter so any logo PNG works. */
  .mv2-fv-wrap {
    position: absolute;
    bottom: -8px; right: -14px;
    width: 84px; height: 84px;
    z-index: 4;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    transition: bottom 480ms cubic-bezier(0.22, 1, 0.36, 1),
                top 480ms cubic-bezier(0.22, 1, 0.36, 1),
                right 480ms cubic-bezier(0.22, 1, 0.36, 1),
                width 480ms cubic-bezier(0.22, 1, 0.36, 1),
                height 480ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mv2-fv {
    width: 76px; height: 76px;
    filter: brightness(0) saturate(100%) contrast(1000%)
            drop-shadow(0 1px 0 #000)
            drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    transition: width 480ms cubic-bezier(0.22, 1, 0.36, 1),
                height 480ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mv2-card.open .mv2-fv-wrap {
    bottom: auto; top: -4px; right: -8px;
    width: 68px; height: 68px;
  }
  .mv2-card.open .mv2-fv { width: 60px; height: 60px; }

  /* Content layer */
  .mv2-body {
    position: relative; z-index: 3;
    padding: 18px;
    transition: padding 480ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mv2-card.open .mv2-body { padding-top: 100px; }

  .mv2-head { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 12px; max-width: 40%; }
  .mv2-card.open .mv2-head { max-width: 100%; margin-bottom: 14px; }
  .mv2-icon { display: flex; align-items: center; gap: 8px;
              font-size: 13px; font-weight: 600; color: #cbd5e1; }
  .mv2-icon .em { font-size: 16px; }
  .mv2-icon .chev { color: #64748b; font-size: 11px; margin-left: 8px;
                    transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1); display: inline-block; }
  .mv2-card.open .mv2-icon .chev { transform: rotate(180deg); }

  .mv2-tag { font-size: 10px; padding: 3px 8px; border-radius: 99px; font-weight: 600;
             text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .mv2-tag.live { background: rgba(74,222,128,0.18); color: #4ade80; }
  .mv2-tag.dark { background: rgba(148,163,184,0.18); color: #94a3b8; }
  .mv2-tag.soon { background: rgba(168,85,247,0.18); color: #c084fc; }

  /* Hero — left-anchored when collapsed, full when expanded */
  .mv2-hero-wrap { overflow: hidden; max-width: 50%;
                   transition: max-width 480ms cubic-bezier(0.22, 1, 0.36, 1); }
  .mv2-card.open .mv2-hero-wrap { max-width: 100%; }
  .mv2-hero-track { display: flex; transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1); }
  .mv2-hero-slide { flex: 0 0 100%; padding: 4px 0 0; text-align: left; }
  .mv2-hero-slide .lbl { color: #64748b; font-size: 11px; text-transform: uppercase;
                         letter-spacing: 0.06em; margin-bottom: 8px; }
  .mv2-hero-slide .num { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
                         background: linear-gradient(180deg, #fff, #cbd5e1);
                         -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                         display: inline-block;
                         filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .mv2-hero-slide .unit { color: #cbd5e1; font-size: 16px; margin-left: 4px; font-weight: 500; }
  .mv2-hero-slide.empty .num { background: none; -webkit-text-fill-color: #64748b;
                               font-size: 20px; font-weight: 500; font-style: italic; }

  /* Astro combo (slide 1) */
  .mv2-astro-combo { padding: 4px 0 0; text-align: left; }
  .mv2-astro-combo .countdown-lbl { color: #64748b; font-size: 11px;
                                    text-transform: uppercase; letter-spacing: 0.06em;
                                    margin-bottom: 8px; }
  .mv2-astro-combo .countdown { font-size: 48px; font-weight: 800; letter-spacing: -0.03em;
                                line-height: 1;
                                background: linear-gradient(180deg, #fff, #cbd5e1);
                                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                                display: inline-block;
                                filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .mv2-astro-combo .endpoint { display: flex; align-items: center; gap: 8px; margin-top: 10px;
                               color: #fbbf24; }
  .mv2-astro-combo .endpoint .e-icon { font-size: 14px; }
  .mv2-astro-combo .endpoint .e-lbl { font-size: 10px; text-transform: uppercase;
                                      letter-spacing: 0.06em; }
  .mv2-astro-combo .endpoint .e-val { font-size: 16px; font-weight: 700; margin-left: 2px;
                                      font-variant-numeric: tabular-nums; }

  /* Swipe nav (arrows + dots) */
  .mv2-swipe-nav { display: flex; align-items: center; gap: 12px;
                   margin-top: 14px; max-width: 50%;
                   transition: max-width 480ms cubic-bezier(0.22, 1, 0.36, 1); }
  .mv2-card.open .mv2-swipe-nav { max-width: 100%; padding-top: 12px;
                                  border-top: 1px solid rgba(255,255,255,0.06); }
  .mv2-swipe-arrow { background: rgba(255,255,255,0.08); border: 0; color: #cbd5e1;
                     width: 26px; height: 26px; border-radius: 7px; cursor: pointer;
                     font-size: 13px; display: flex; align-items: center; justify-content: center;
                     transition: background 120ms; flex-shrink: 0; }
  .mv2-swipe-arrow:hover { background: rgba(255,255,255,0.18); }
  .mv2-swipe-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .mv2-swipe-dots { display: flex; gap: 6px; }
  .mv2-swipe-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2);
                   transition: all 200ms; }
  .mv2-swipe-dot.on { background: #60a5fa; width: 18px; border-radius: 99px; }

  /* Expanded panel — grid-template-rows 0fr → 1fr trick.
     min-height: 0 on the inner wrapper is REQUIRED or the animation
     silently fails on tall content (weather card with hourly + 7-day). */
  .mv2-panel { display: grid; grid-template-rows: 0fr; opacity: 0;
               transition: grid-template-rows 450ms cubic-bezier(0.16, 1, 0.3, 1),
                           opacity 320ms ease-out; }
  .mv2-panel > .mv2-panel-inner { overflow: hidden; min-height: 0; }
  .mv2-card.open .mv2-panel { grid-template-rows: 1fr; opacity: 1; }
  .mv2-panel-grid { display: flex; flex-direction: column; gap: 4px;
                    padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
  .mv2-panel-row { display: flex; justify-content: space-between; align-items: baseline;
                   padding: 10px 8px; margin: 0 -8px; border-radius: 8px;
                   cursor: pointer; transition: background 120ms; }
  .mv2-panel-row:hover { background: rgba(255,255,255,0.04); }
  .mv2-panel-row .lbl { color: #cbd5e1; font-size: 14px; }
  .mv2-panel-row .val { font-size: 22px; font-weight: 700; }
  .mv2-panel-row .val .u { font-size: 13px; color: #94a3b8; margin-left: 4px; font-weight: 500; }
  .mv2-panel-row.empty .val { color: #64748b; font-size: 13px; font-weight: 400; font-style: italic; }

  /* Context line under hero (e.g. "Alaska gauge dormant…") */
  .mv2-ctx { background: rgba(251,146,60,0.08); border: 1px solid rgba(251,146,60,0.25);
             border-radius: 10px; padding: 10px 12px; font-size: 12px;
             color: #fed7aa; margin-top: 14px; display: flex; align-items: flex-start; gap: 8px;
             max-width: 60%; }
  .mv2-card.open .mv2-ctx { max-width: 100%; }
  .mv2-ctx .em { font-size: 14px; flex-shrink: 0; }

  /* Solunar rating badge + table */
  .mv2-rating-badge { font-size: 10px; padding: 3px 8px; border-radius: 99px; font-weight: 700;
                      text-transform: uppercase; letter-spacing: 0.05em; }
  .mv2-rating-badge.excellent { background: rgba(74,222,128,0.22); color: #4ade80; }
  .mv2-rating-badge.good      { background: rgba(96,165,250,0.22); color: #60a5fa; }
  .mv2-rating-badge.average   { background: rgba(251,191,36,0.22); color: #fbbf24; }
  .mv2-rating-badge.poor      { background: rgba(148,163,184,0.18); color: #94a3b8; }

  .mv2-solunar-hero { padding: 4px 0 0; text-align: left; }
  .mv2-solunar-hero .label { color: #64748b; font-size: 11px; text-transform: uppercase;
                             letter-spacing: 0.06em; margin-bottom: 8px; }
  .mv2-solunar-hero .countdown { font-size: 38px; font-weight: 800; letter-spacing: -0.02em;
                                 line-height: 1.1;
                                 background: linear-gradient(180deg, #fff, #cbd5e1);
                                 -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                                 display: inline-block;
                                 filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .mv2-solunar-hero .rating { display: inline-block; margin-top: 12px; }

  .mv2-panel-title { color: #64748b; font-size: 10px; text-transform: uppercase;
                     letter-spacing: 0.08em; margin: 14px 0 -4px; padding-top: 12px;
                     border-top: 1px solid rgba(255,255,255,0.04); }

  .mv2-solunar-table { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .mv2-solunar-row { display: grid; grid-template-columns: 24px 70px 1fr 110px;
                     gap: 10px; align-items: center; font-size: 13px;
                     padding: 8px 10px; border-radius: 8px;
                     background: rgba(255,255,255,0.03); }
  .mv2-solunar-row.now { background: rgba(74,222,128,0.10);
                         border: 1px solid rgba(74,222,128,0.3); }
  .mv2-solunar-row .icon { text-align: center; font-size: 14px; }
  .mv2-solunar-row .label-cell { color: #cbd5e1; font-weight: 600; }
  .mv2-solunar-row .label-cell .sub { color: #64748b; font-weight: 400; font-size: 11px;
                                      display: block; margin-top: 1px; }
  .mv2-solunar-row .kind { color: #94a3b8; font-size: 11px; text-transform: uppercase;
                           letter-spacing: 0.04em; }
  .mv2-solunar-row .time { color: #e5e7eb; font-weight: 700;
                           font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
  .mv2-solunar-row.major .label-cell { color: #fbbf24; }
  .mv2-solunar-row.minor .label-cell { color: #93c5fd; }

  /* Hourly + 7-day forecast strips (weather card expanded) */
  .mv2-hourly { display: flex; gap: 12px; overflow-x: auto; margin-top: 14px;
                padding: 12px 0 4px; scrollbar-width: thin; }
  .mv2-hour { flex-shrink: 0; text-align: center; min-width: 48px; cursor: pointer;
              padding: 4px; border-radius: 6px; transition: background 120ms; }
  .mv2-hour:hover { background: rgba(255,255,255,0.04); }
  .mv2-hour .t  { color: #64748b; font-size: 11px; }
  .mv2-hour .em { font-size: 18px; margin: 4px 0; display: block; }
  .mv2-hour .v  { font-size: 14px; font-weight: 600; }
  .mv2-forecast { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .mv2-fday { display: grid; grid-template-columns: 44px 22px 50px 1fr 50px; gap: 10px;
              align-items: center; font-size: 13px; padding: 4px 0; }
  .mv2-fday .day { color: #cbd5e1; font-weight: 500; }
  .mv2-fday .ic  { font-size: 16px; text-align: center; }
  .mv2-fday .lo, .mv2-fday .hi { color: #94a3b8; text-align: center; font-variant-numeric: tabular-nums; }
  .mv2-fday .hi { color: #e5e7eb; font-weight: 600; }
  .mv2-fday .bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px;
                   position: relative; overflow: hidden; }
  .mv2-fday .bar::after { content: ""; position: absolute; height: 100%;
                          background: linear-gradient(90deg, #60a5fa, #fbbf24, #ef4444);
                          border-radius: 99px;
                          left: var(--l, 20%); right: var(--r, 20%); }

  /* Radar placeholder card */
  .mv2-radar-empty { aspect-ratio: 16/9; background: repeating-linear-gradient(45deg,
                       rgba(16,185,129,0.06) 0 10px, transparent 10px 20px);
                     border: 1px dashed rgba(16,185,129,0.3); border-radius: 12px;
                     display: flex; flex-direction: column; align-items: center; justify-content: center;
                     color: #6ee7b7; font-size: 13px; gap: 6px; margin-top: 14px; }
  .mv2-radar-empty .em { font-size: 28px; }

  /* Drill-down sheet — opens when a row inside an expanded card is tapped.
     Shows the current value front-and-center, plus a "history coming soon"
     section. Real 24h history wires in once backend surfaces it. */
  .mv2-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55);
               opacity: 0; pointer-events: none; transition: opacity 240ms;
               z-index: 5000;
               backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .mv2-scrim.on { opacity: 1; pointer-events: auto; }
  .mv2-drill-sheet { position: fixed; left: 50%; bottom: 0;
                     transform: translate(-50%, 100%);
                     max-width: 480px; width: calc(100% - 16px); margin: 0 8px;
                     background: linear-gradient(180deg, #1e2735 0%, #161c28 100%);
                     border: 1px solid #2a3447; border-bottom: 0;
                     border-radius: 18px 18px 0 0; padding: 14px 18px 24px;
                     max-height: 80vh; overflow-y: auto;
                     transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
                     z-index: 5001; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
                     color: #e5e7eb;
                     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  .mv2-drill-sheet.on { transform: translate(-50%, 0); }
  .mv2-drill-sheet .grip { width: 36px; height: 4px; background: #475569;
                           border-radius: 99px; margin: 0 auto 14px; }

  /* Brookie banner across the top of the sheet — same art the user has
     active on their card, gradient-blended into the sheet's dark
     background so the data underneath reads cleanly. FlyVault logo
     silhouette tucked into the corner mirrors the card treatment.
     Routes through mv2GetCardArt() so when Phase H ships the skin
     picker, this banner skins with the cards. */
  .mv2-drill-art {
    position: relative;
    width: calc(100% + 36px); /* bleed to the rounded sheet edges */
    margin: -14px -18px 14px;  /* pull up to kiss the top edge */
    height: 96px;
    overflow: hidden;
    border-radius: 18px 18px 0 0;
  }
  .mv2-drill-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Vertical gradient blend so the banner fades into the sheet body */
  .mv2-drill-art::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      transparent 0%,
      transparent 35%,
      rgba(30, 39, 53, 0.30) 60%,
      rgba(30, 39, 53, 0.80) 85%,
      #1e2735 100%);
  }
  /* Side vignette so the banner doesn't crop hard at sheet edges */
  .mv2-drill-art::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(to right, rgba(30,39,53,0.20) 0%, transparent 6%, transparent 94%, rgba(30,39,53,0.20) 100%);
  }
  /* FlyVault logo silhouette — mirrors the card's expanded-state placement */
  .mv2-drill-fv-wrap {
    position: absolute; top: -4px; right: -8px;
    width: 68px; height: 68px;
    z-index: 2;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .mv2-drill-fv {
    width: 60px; height: 60px;
    filter: brightness(0) saturate(100%) contrast(1000%)
            drop-shadow(0 1px 0 #000)
            drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }
  .mv2-drill-head { display: flex; justify-content: space-between;
                    align-items: flex-start; margin-bottom: 16px; }
  .mv2-drill-title { font-size: 13px; text-transform: uppercase;
                     letter-spacing: 0.06em; color: #94a3b8; font-weight: 600; }
  .mv2-drill-current { font-size: 42px; font-weight: 800; letter-spacing: -0.02em;
                       margin-top: 6px;
                       background: linear-gradient(180deg, #fff, #cbd5e1);
                       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .mv2-drill-current .u { font-size: 14px; color: #94a3b8; margin-left: 4px;
                          -webkit-text-fill-color: #94a3b8; }
  .mv2-drill-close { background: rgba(255,255,255,0.08); border: 0; color: #cbd5e1;
                     width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
                     font-size: 16px; display: flex; align-items: center;
                     justify-content: center; padding: 0; }
  .mv2-drill-section { margin-top: 18px; }
  .mv2-drill-section-title { color: #64748b; font-size: 10px; text-transform: uppercase;
                             letter-spacing: 0.08em; margin-bottom: 10px; }
  .mv2-drill-placeholder { background: rgba(255,255,255,0.02);
                           border: 1px dashed rgba(255,255,255,0.10);
                           border-radius: 10px; padding: 18px 14px;
                           color: #64748b; font-size: 13px; text-align: center;
                           line-height: 1.5; }
  .mv2-drill-placeholder .em { font-size: 20px; display: block; margin-bottom: 6px; }
  .mv2-drill-note { background: rgba(96,165,250,0.08);
                    border: 1px solid rgba(96,165,250,0.25);
                    border-radius: 10px; padding: 10px 12px; font-size: 12px;
                    color: #93c5fd; margin-top: 14px;
                    display: flex; align-items: flex-start; gap: 8px; }
</style>

<body class="dark hand-right">

<div class="wrap">

  <header>
    <a class="back-vault" id="backVault" href="https://flyvault.net/" data-train="back-vault">
      <span class="vault-door" aria-hidden="true"></span>
      <span>Back to the Vault</span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" data-train="menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main id="canvas">
    <!-- Welcome state -->
    <div class="welcome" id="welcome">
      <div class="logo-wrap">
        <div class="halo" aria-hidden="true"></div>
        <div class="logo-disc">
          <img id="logoImg" src="assets/logo-silver.png" alt="MIDGE logo">
        </div>
      </div>
      <h1>Talk to MIDGE</h1>
      <div class="sub">What do we need to tackle today?</div>
      <!-- Suggested chips — hidden for launch, restore before wider release
      <div class="chips" id="chips">
        <button class="chip" data-q="Tell me about the Greensleeves">Tell me about the Greensleeves</button>
        <button class="chip" data-q="Show me a Black Doctor">Show me a Black Doctor</button>
        <button class="chip" data-q="What's a good early-spring midge pattern?">Good early-spring midge?</button>
        <button class="chip" data-q="Who tied the Royal Wulff?">Who tied the Royal Wulff?</button>
      </div>
      -->
      <div class="chips" id="chips" style="display:none"></div>
    </div>

    <!-- Conversation state -->
    <div class="log hidden" id="log"></div>
  </main>

  <footer>
    <form id="composer">
      <textarea id="q" placeholder="Ask MIDGE about a pattern, hatch, or water…" rows="1" autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>

</div>

<!-- Menu drawer -->
<aside class="drawer" id="drawer" aria-label="My Midge menu">
  <div class="drawer-header">My Midge</div>

  <div class="drawer-section">
    <!-- My Logo -->
    <div class="drawer-item" data-train="my-logo">
      <span class="label">My Logo</span>
      <span class="ctrl logo-picker" id="logoPicker">
        <button class="logo-opt on" data-logo="assets/logo-silver.png" title="Silver"><img src="assets/logo-silver.png" alt=""></button>
        <button class="logo-opt"    data-logo="assets/logo-white.png"  title="White"><img src="assets/logo-white.png"  alt=""></button>
        <button class="logo-opt"    data-logo="assets/logo-black.png"  title="Black"><img src="assets/logo-black.png"  alt=""></button>
      </span>
    </div>

    <!-- My Background -->
    <div class="drawer-item" data-train="my-bg" id="bgRow">
      <span class="label">My Background</span>
      <span class="ctrl">
        <span class="swatch-wrap">
          <input type="color" id="bgInput" aria-label="Background color">
          <span class="swatch" id="bgSwatch"></span>
        </span>
      </span>
    </div>

    <!-- My Words / Text -->
    <div class="drawer-item" data-train="my-words" id="textRow">
      <span class="label">My Words / Text</span>
      <span class="ctrl">
        <span class="swatch-wrap">
          <input type="color" id="textInput" aria-label="Text color">
          <span class="swatch" id="textSwatch"></span>
        </span>
      </span>
    </div>

    <!-- Behind My Logo -->
    <div class="drawer-item" data-train="behind-logo" id="discRow">
      <span class="label">Behind My Logo</span>
      <span class="ctrl">
        <span class="swatch-wrap">

<script>
/* ────────────────────────────────────────────────────────────
   MIDGE 2.0 — wired chat page

const API = "https://midge-backend-production.up.railway.app/ask";

// ── Session ID (carries sticky tyer across turns) ───────────
function makeSessionId() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c/4)).toString(16));
}
const SESSION_ID = (() => {
  try {
    let id = sessionStorage.getItem("midge_session_id");
    if (!id) { id = makeSessionId(); sessionStorage.setItem("midge_session_id", id); }
    return id;
  } catch { return makeSessionId(); }
})();

// ── Training-wheels modal map ───────────────────────────────
// Update copy here. Set window.MIDGE_TRAINING=false to disable globally.
window.MIDGE_TRAINING = true;
const TRAINING = {
  "menu":         { title: "My Midge menu",        body: "Open this to change how MIDGE looks. Logo, colors, halo, and which side things sit on." },
  "back-vault":   { title: "Back to the Vault",    body: "Tap to leave MIDGE and return to FlyVault." },
  "my-logo":      { title: "My Logo",              body: "Pick one of three logos. Silver, white, or black." },
  "my-bg":        { title: "My Background",        body: "Change the color of the page behind everything." },
  "my-words":     { title: "My Words / Text",      body: "Change the color of the writing on the page." },
  "behind-logo":  { title: "Behind My Logo",       body: "Change the circle that sits behind your logo." },
  "my-halo":      { title: "My Halo",              body: "Turn the ring of light around your logo on or off." },
  "theme":        { title: "Light or Dark",        body: "Pick a starting look. Light is warm and bright. Dark is calm and quiet. You can change any color from there." },
  "my-hand":      { title: "My Hand",              body: "Pick which side of the screen your menu sits on. R for right-handed (default). L for left-handed — your menu moves to the left, the Vault button moves to the right." },
  "reset":        { title: "Reset",                body: "Put everything back to default." }
};
const seenTrainingKey = "midge_training_seen";
function getSeen() { try { return JSON.parse(localStorage.getItem(seenTrainingKey) || "{}"); } catch { return {}; } }
function markSeen(k) { const s = getSeen(); s[k]=1; try{ localStorage.setItem(seenTrainingKey, JSON.stringify(s)); }catch{} }

const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");

// Intercept first-tap on any [data-train] element
document.addEventListener("click", e => {

// ── Preferences (persisted) ─────────────────────────────────
const PREFS_KEY = "midge_prefs_v1";
const DEFAULT_PREFS = {
  theme: "dark",
  hand: "right",
  halo: "on",

}
function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {} }
let prefs = loadPrefs();

function applyPrefs() {
  // Theme
  document.body.classList.toggle("dark",  prefs.theme === "dark");
  document.body.classList.toggle("light", prefs.theme === "light");

  setSwatch("textSwatch", getEffective("--text"));
  setSwatch("discSwatch", getEffective("--disc"));
}
function setVar(name, value) {
  if (value) document.body.style.setProperty(name, value);
  else       document.body.style.removeProperty(name);
}
function getEffective(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}
function setPill(id, attr, val) {

}

}

// ── Menu drawer open/close ──────────────────────────────────
const drawer = document.getElementById("drawer");

// ── Drawer pill handlers ────────────────────────────────────
document.getElementById("themePill").addEventListener("click", e => {

document.getElementById("haloPill").addEventListener("click", e => {

// Logo picker

// Color rows — the native <input type="color"> sits ON TOP of the swatch
// inside .swatch-wrap, so a tap opens the picker directly. We just keep
// its initial value in sync with the current effective color and listen
// for changes.
function wireColor(inputId, prefKey, cssVar) {
  const input = document.getElementById(inputId);
  // Set initial value before the user opens the picker
  function syncValue() {
    input.value = rgbToHex(getEffective(cssVar)) || "#000000";
  }
  syncValue();
  input.addEventListener("focus", syncValue);
  input.addEventListener("click", syncValue);
  input.addEventListener("input", () => {
    prefs[prefKey] = input.value;
    savePrefs(prefs);
    applyPrefs();
  });
}
wireColor("bgInput",   "bg",   "--bg");
wireColor("textInput", "text", "--text");
wireColor("discInput", "disc", "--disc");

function rgbToHex(rgb) {
  if (!rgb) return null;
  if (rgb.startsWith("#")) return rgb;
  const m = rgb.match(/\d+/g);
  if (!m) return null;
  return "#" + m.slice(0,3).map(n => parseInt(n).toString(16).padStart(2,"0")).join("");
}

// ── Chat plumbing ───────────────────────────────────────────
const canvas = document.getElementById("canvas");
const welcome = document.getElementById("welcome");
const log = document.getElementById("log");
const form = document.getElementById("composer");
const q = document.getElementById("q");
const send = document.getElementById("send");
const history = [];

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function render(text) {
  let t = escapeHtml(text);
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => `<img src="${url}" alt="${alt}">`);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
