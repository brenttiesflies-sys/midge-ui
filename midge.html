/* ─────── Inline artifact renderers ─────────────────────────────
   Backend's /ask response now includes an `artifacts` array. Each
   entry is {type, data}. Map artifacts produce a live Mapbox view;
   conditions artifacts produce a weather-app-style card. Both render
   below the model's narration text in the same chat bubble.
*/

// Used to suffix DOM ids so multiple maps in the same chat don't collide.
let _artifactCounter = 0;

// ───────────────────────────────────────────────────────────────────
// Phase B: v6 card renderer (card_schema_version === 2)
//
// Activated whenever bundle.card_schema_version === 2 (current backend).
// Renders three independent cards (water/weather/astronomy) with hero
// number anchored left, brookie flank art anchored right, FlyVault logo
// tucked into the corner. Tap-to-expand. Swipe through hero slides
// before expanding. Each card has a 3px colored top stripe matching
// its data type.
//
// Architecture notes:
//  • DOM-mutating, NOT re-rendering. Re-rendering the whole chat bubble
//    would destroy the Mapbox map. So we use class toggles + inline
//    transforms to switch hero slides / expand state.
//  • Each card instance gets a unique data-card-id so the delegated
//    click handler can target the right one.
//  • The art lookup goes through mv2GetCardArt() — Phase H ready. v1
//    always returns the brookie. Phase H reads from userPrefs.
//  • The interaction wire-up runs once (mv2InitInteractions()) at first
//    use. After that the delegated handler catches all future cards.
// ───────────────────────────────────────────────────────────────────

let _mv2CardCounter = 0;
let _mv2InteractionsWired = false;

/**
 * Skin lookup. v1 returns the default brookie for every card. Phase H
 * will key off userPrefs.active_skin_per_card[cardKey]; Phase I will
 * key off userPrefs.user_photo_per_card; Phase J will cycle through an
 * array. Keep this funnel narrow — DO NOT bake the path into the card
 * markup directly.
 */
function mv2GetCardArt(cardKey, userPrefs) {
  // Future: userPrefs?.active_skin_per_card?.[cardKey] || ...
  return "assets/brookie-art-1.png";
}

/**
 * Render one card (water / weather / astro). cardData is a card_v2
 * card block: {status, fields, reason_if_missing, ...}. cardKey is
 * "water" / "weather" / "astro".
 */
function mv2RenderCard(cardKey, cardData, ctx) {
  if (!cardData) return "";
  const id = `mv2-${++_mv2CardCounter}`;
  const ICONS  = { water: "💧", weather: "🌤", astro: "🌅" };
  const TITLES = { water: "Water", weather: "Weather", astro: "Astronomy" };

  const fields = Array.isArray(cardData.fields) ? cardData.fields : [];
  const reason = cardData.reason_if_missing || null;

  // ─── Hero slides ───
  let heroSlidesHtml = "";
  let heroCount = 0;
  let contextLine = "";

  if (cardKey === "astro") {
    // 3 hero slides: countdown+sun, moon phase, solunar countdown+rating.
    const r = mv2BuildAstroHeroes(fields, cardData);
    heroSlidesHtml = r.slides;
    heroCount = r.count;
  } else {
    // Each field becomes a hero slide.
    heroSlidesHtml = fields.map(f => mv2RenderHeroSlide(f)).join("");
    heroCount = fields.length;
  }

  if (cardData.context || reason) {
    const text = cardData.context || mv2ReasonContextText(reason, cardData);
    if (text) {
      contextLine = `<div class="mv2-ctx"><span class="em">ℹ️</span><span>${escapeHtml(text)}</span></div>`;
    }
  }

  // ─── Status tag ───
  let tagHtml;
  if (cardData.status === "no_live_data" || cardData.status === "partial") {
    const tagText = mv2TagForReason(reason);
    tagHtml = `<span class="mv2-tag dark">${escapeHtml(tagText)}</span>`;
  } else if (cardData.status === "ok") {
    tagHtml = `<span class="mv2-tag live">live</span>`;
  } else {
    tagHtml = "";
  }

  // ─── Panel rows ───
  const panelRows = fields.map(f => mv2RenderPanelRow(cardKey, f)).join("");

  // ─── Expanded extras (weather hourly+forecast, astro solunar table) ───
  let expandedExtras = "";
  if (cardKey === "astro" && cardData.solunar_table) {
    expandedExtras = mv2RenderSolunarTable(cardData.solunar_table, cardData.solunar_day_rating);
  } else if (cardKey === "weather" && (ctx.hourly || ctx.forecast)) {
    expandedExtras = mv2RenderWeatherExtras(ctx.hourly, ctx.forecast);
  }

  // ─── Swipe nav (only when there's >1 hero slide) ───
  const dots = Array.from({ length: heroCount }, (_, i) =>
    `<span class="mv2-swipe-dot${i === 0 ? " on" : ""}"></span>`
  ).join("");
  const swipeNav = heroCount > 1 ? `
    <div class="mv2-swipe-nav">
      <button class="mv2-swipe-arrow" data-mv2-swipe="prev" disabled>‹</button>
      <div class="mv2-swipe-dots">${dots}</div>
      <button class="mv2-swipe-arrow" data-mv2-swipe="next">›</button>
    </div>` : "";

  const artSrc = mv2GetCardArt(cardKey, ctx.userPrefs);

  return `
    <div class="mv2-card ${cardKey}" data-mv2-card="${id}" data-mv2-key="${cardKey}"
         data-mv2-hero-idx="0" data-mv2-hero-count="${heroCount}">
      <div class="mv2-art">
        <img src="${escapeHtml(artSrc)}" alt=""
             onerror="this.style.display='none'">
      </div>
      <div class="mv2-fv-wrap">
        <img class="mv2-fv" src="assets/logo-black.png" alt="">
      </div>
      <div class="mv2-body">
        <div class="mv2-head">
          <div class="mv2-icon">
            <span class="em">${ICONS[cardKey] || ""}</span> ${TITLES[cardKey] || cardKey}
            <span class="chev">▾</span>
          </div>
          ${tagHtml}
        </div>
        <div class="mv2-hero-wrap">
          <div class="mv2-hero-track" style="transform:translateX(0%)">
            ${heroSlidesHtml}
          </div>
        </div>
        ${swipeNav}
        ${contextLine}
        <div class="mv2-panel">
          <div class="mv2-panel-inner">
            <div class="mv2-panel-grid">${panelRows}</div>
            ${expandedExtras}
          </div>
        </div>
      </div>
    </div>`;
}

function mv2RenderHeroSlide(field) {
  const v = field.value;
  const empty = (v === null || v === undefined || v === "");
  const unit = field.unit || "";
  const valHtml = empty
    ? `<span class="num">no live data</span>`
    : `<span class="num">${escapeHtml(String(v))}</span>` +
      (unit ? `<span class="unit">${escapeHtml(unit)}</span>` : "");
  return `<div class="mv2-hero-slide${empty ? " empty" : ""}">
            <div class="lbl">${escapeHtml(field.label || "")}</div>
            <div>${valHtml}</div>
          </div>`;
}

function mv2RenderPanelRow(cardKey, field) {
  const v = field.value;
  const empty = (v === null || v === undefined || v === "");
  const unit = field.unit || "";
  const valHtml = empty
    ? `<span class="val" style="color:#64748b;font-size:13px;font-weight:400;font-style:italic">no live data</span>`
    : `<span class="val">${escapeHtml(String(v))}` +
      (unit ? `<span class="u">${escapeHtml(unit)}</span>` : "") +
      `</span>`;
  // data-mv2-drill carries everything the sheet needs to render. We pack
  // value + unit + label into a single attribute (URI-encoded) so the
  // click handler doesn't have to traverse the DOM to reassemble them.
  const payload = JSON.stringify({
    cardKey,
    label: field.label || "",
    value: empty ? null : String(v),
    unit: unit,
  });
  return `<div class="mv2-panel-row${empty ? " empty" : ""}"
               data-mv2-drill="${escapeHtml(encodeURIComponent(payload))}">
            <span class="lbl">${escapeHtml(field.label || "")}</span>
            ${valHtml}
          </div>`;
}

/**
 * Build the 3 astronomy hero slides:
 *  1. Daylight countdown + approaching sun event (sunset OR sunrise)
 *  2. Moon phase emoji + name
 *  3. Solunar next-period countdown + day rating badge
 * The first slide's countdown is computed client-side from sunrise/
 * sunset times so it stays live without polling.
 */
function mv2BuildAstroHeroes(fields, cardData) {
  const byLabel = {};
  fields.forEach(f => { byLabel[(f.label || "").toLowerCase()] = f; });
  const sunriseStr = byLabel["sunrise"]?.value;
  const sunsetStr  = byLabel["sunset"]?.value;
  const moonPhase  = byLabel["moon phase"]?.value;
  const nextSolunar = byLabel["next solunar"]?.value;
  const dayRating  = byLabel["day rating"]?.value || cardData.solunar_day_rating;

  // ─── Slide 1: daylight countdown ───
  const countdown = mv2ComputeDaylight(sunriseStr, sunsetStr);
  let slide1;
  if (countdown) {
    slide1 = `
      <div class="mv2-hero-slide">
        <div class="mv2-astro-combo">
          <div class="countdown-lbl">${escapeHtml(countdown.leadLabel)}</div>
          <div class="countdown">${escapeHtml(countdown.leadValue)}</div>
          <div class="endpoint">
            <span class="e-icon">${countdown.sunUp ? "🌇" : "🌅"}</span>
            <span class="e-lbl">${countdown.sunUp ? "Sunset" : "Sunrise"}</span>
            <span class="e-val">${escapeHtml(countdown.endpointTime || "")}</span>
          </div>
        </div>
      </div>`;
  } else {
    // Fall back to listing the sunrise field as a regular hero slide
    slide1 = mv2RenderHeroSlide(byLabel["sunrise"] || {label:"Sunrise", value:null, unit:""});
  }

  // ─── Slide 2: moon phase ───
  const slide2 = mv2RenderHeroSlide({
    label: "Moon phase", value: moonPhase, unit: ""
  });

  // ─── Slide 3: solunar ───
  let slide3 = "";
  let count = 2;
  if (nextSolunar) {
    const rc = (dayRating || "").toLowerCase();
    const badge = dayRating
      ? `<div class="rating"><span class="mv2-rating-badge ${escapeHtml(rc)}">${escapeHtml(dayRating)} day</span></div>`
      : "";
    slide3 = `
      <div class="mv2-hero-slide">
        <div class="mv2-solunar-hero">
          <div class="label">Next solunar window</div>
          <div class="countdown">${escapeHtml(nextSolunar)}</div>
          ${badge}
        </div>
      </div>`;
    count = 3;
  }

  return { slides: slide1 + slide2 + slide3, count };
}

/**
 * Compute the daylight-countdown hero text from sunrise/sunset strings.
 * Strings come from the backend as HH:MM local time. Returns null when
 * unparseable (defensive — astronomy may be missing).
 */
function mv2ComputeDaylight(sunriseStr, sunsetStr) {
  if (!sunriseStr || !sunsetStr) return null;
  const sr = mv2ParseHM(sunriseStr);
  const ss = mv2ParseHM(sunsetStr);
  if (sr === null || ss === null) return null;
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const sunUp = (nowMins >= sr && nowMins < ss);
  let lead, label, endpoint;
  if (sunUp) {
    lead = ss - nowMins;
    label = "Daylight left";
    endpoint = sunsetStr;
  } else {
    lead = (nowMins < sr) ? (sr - nowMins) : (24 * 60 - nowMins + sr);
    label = "Sunrise in";
    endpoint = sunriseStr;
  }
  return {
    leadLabel: label,
    leadValue: mv2FmtDuration(lead),
    endpointTime: endpoint,
    sunUp,
  };
}

function mv2ParseHM(s) {
  // Accept "HH:MM", "H:MM AM/PM", or "HH:MM:SS". Return minutes-since-midnight.
  if (typeof s !== "string") return null;
  const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?$/i);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  const ampm = (m[3] || "").toUpperCase();
  if (ampm === "PM" && h < 12) h += 12;
  if (ampm === "AM" && h === 12) h = 0;
  if (h < 0 || h > 23 || min < 0 || min > 59) return null;
  return h * 60 + min;
}

function mv2FmtDuration(mins) {
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

function mv2ReasonContextText(reason, cardData) {
  // Friendly one-liner per reason code — matches the Phase C prompt
  // templates so the LLM narration and the card chrome stay aligned.
  if (!reason) return "";
  const dam = cardData.dam_operator;
  const TEMPLATES = {
    alaska_seasonal: "Live gauge is dormant this time of year — USGS only publishes when the river opens up in summer.",
    dam_controlled:  dam ? `Flow is ${dam}-controlled — no live USGS gauge. Check the release schedule.` : "Flow is dam-controlled — no live USGS gauge. Check the release schedule.",
    no_public_gauge: "No public gauge on this water — local shops and outfitters are your best source for current conditions.",
    gauge_inactive:  "USGS gauge isn't reporting right now — could be a temporary outage. Local shop reports are more reliable.",
    usgs_timeout:    "USGS timed out on the lookup. Trying again often works.",
    no_gauge_assigned: "No gauge here — use weather + recent precip as your read.",
    openmeteo_timeout: "Open-Meteo timed out — weather data not available right now.",
    astral_error:    "Astronomy data unavailable.",
  };
  return TEMPLATES[reason] || "";
}

function mv2TagForReason(reason) {
  const MAP = {
    alaska_seasonal: "seasonal",
    dam_controlled:  "dam-controlled",
    no_public_gauge: "no public gauge",
    gauge_inactive:  "offline",
    usgs_timeout:    "timeout",
    no_gauge_assigned: "no gauge",
    openmeteo_timeout: "timeout",
    astral_error:    "unavailable",
  };
  return MAP[reason] || "no live data";
}

function mv2RenderSolunarTable(table, dayRating) {
  if (!Array.isArray(table) || table.length === 0) return "";
  const SUBKIND_ICON = { transit: "⬆", underfoot: "⬇", moonrise: "🌅", moonset: "🌇" };
  const rc = (dayRating || "").toLowerCase();
  const badge = dayRating
    ? `<span class="mv2-rating-badge ${escapeHtml(rc)}" style="margin-left:8px;vertical-align:middle">${escapeHtml(dayRating)} day</span>`
    : "";
  const rows = table.map(w => {
    const kind = (w.kind || "").toLowerCase();
    const subkind = (w.subkind || "").toLowerCase();
    const icon = w.in_daylight ? "☀" : "🌙";
    const subIcon = SUBKIND_ICON[subkind] || "";
    const nowCls = w.is_now ? " now" : "";
    return `<div class="mv2-solunar-row ${escapeHtml(kind)}${nowCls}">
              <span class="icon">${icon}</span>
              <span class="label-cell">${escapeHtml(w.label || "")}<span class="sub">${subIcon} ${escapeHtml(subkind)}</span></span>
              <span class="kind">${escapeHtml(kind)}${w.is_now ? " · NOW" : ""}</span>
              <span class="time">${escapeHtml(w.start || "")} – ${escapeHtml(w.end || "")}</span>
            </div>`;
  }).join("");
  return `
    <div class="mv2-panel-title">Today's solunar windows ${badge}</div>
    <div class="mv2-solunar-table">${rows}</div>`;
}

function mv2RenderWeatherExtras(hourly, forecast) {
  let html = "";
  if (Array.isArray(hourly) && hourly.length) {
    html += `<div class="mv2-panel-title">Next 24 hours</div>
             <div class="mv2-hourly">` +
      hourly.map(h => `<div class="mv2-hour">
        <div class="t">${escapeHtml(h.t || "")}</div>
        <div class="em">${escapeHtml(h.icon || "")}</div>
        <div class="v">${escapeHtml(h.v || "")}</div>
      </div>`).join("") +
      `</div>`;
  }
  if (Array.isArray(forecast) && forecast.length) {
    html += `<div class="mv2-panel-title">7-day forecast</div>
             <div class="mv2-forecast">` +
      forecast.map(d => `<div class="mv2-fday" style="--l:${(d.l||20)}%;--r:${(d.r||20)}%">
        <span class="day">${escapeHtml(d.day || "")}</span>
        <span class="ic">${escapeHtml(d.ic || "")}</span>
        <span class="lo">${escapeHtml(String(d.lo ?? ""))}°</span>
        <span class="bar"></span>
        <span class="hi">${escapeHtml(String(d.hi ?? ""))}°</span>
      </div>`).join("") +
      `</div>`;
  }
  return html;
}

/**
 * Top-level v6 renderer. Takes a bundle (the get_hatch_conditions
 * result), returns the HTML for the three-card stack. Order:
 * weather → water → astronomy → radar (placeholder). When a card's
 * block is missing entirely, skip that card.
 */
function renderConditionsCardV2(bundle) {
  const card_v2 = bundle.card_v2 || {};
  // Hourly + forecast come on the raw weather block, not in card_v2 yet
  // (backend keeps them on bundle.raw.weather). Surface them so the
  // weather card's expanded panel can render the strip.
  const raw = bundle.raw || {};
  const weatherRaw = raw.weather || {};
  const ctx = {
    userPrefs: null,                      // Phase H wires this up
    hourly: weatherRaw.hourly_24h || null,
    forecast: weatherRaw.forecast_7day || null,
  };

  // Make sure interactions are wired (idempotent).
  mv2InitInteractions();

  let html = `<div class="mv2-stack">`;
  if (card_v2.weather_card)   html += mv2RenderCard("weather", card_v2.weather_card, ctx);
  if (card_v2.water_card)     html += mv2RenderCard("water",   card_v2.water_card,   ctx);
  if (card_v2.astronomy_card) html += mv2RenderCard("astro",   card_v2.astronomy_card, ctx);
  // Radar placeholder — Phase F builds out, this card is just a "next
  // phase" marker so anglers see it's coming.
  html += `
    <div class="mv2-card radar">
      <div class="mv2-art">
        <img src="${escapeHtml(mv2GetCardArt('radar', null))}" alt=""
             onerror="this.style.display='none'">
      </div>
      <div class="mv2-fv-wrap"><img class="mv2-fv" src="assets/logo-black.png" alt=""></div>
      <div class="mv2-body">
        <div class="mv2-head">
          <div class="mv2-icon"><span class="em">📡</span> Radar</div>
          <span class="mv2-tag soon">next phase</span>
        </div>
        <div class="mv2-hero-wrap" style="max-width:60%">
          <div class="mv2-hero-slide">
            <div class="lbl" style="color:#6ee7b7">coming soon</div>
            <div style="font-size:18px;color:#cbd5e1;font-weight:500;margin-top:6px">
              Precip radar overlay
            </div>
          </div>
        </div>
      </div>
    </div>`;
  html += `</div>`;
  return html;
}

/**
 * Wire up tap-to-expand, swipe-nav, and touch-swipe handlers via event
 * delegation on document. Idempotent — call as many times as you want,
 * only fires once. Lives on document so it picks up cards rendered into
 * future chat bubbles too.
 */
function mv2InitInteractions() {
  if (_mv2InteractionsWired) return;
  _mv2InteractionsWired = true;

  // Make sure the singleton scrim + drill sheet exist in the DOM.
  // They live at <body> level so they overlay anything.
  if (!document.getElementById("mv2-scrim")) {
    const scrim = document.createElement("div");
    scrim.id = "mv2-scrim";
    scrim.className = "mv2-scrim";
    document.body.appendChild(scrim);
  }
  if (!document.getElementById("mv2-drill-sheet")) {
    const sheet = document.createElement("div");
    sheet.id = "mv2-drill-sheet";
    sheet.className = "mv2-drill-sheet";
    document.body.appendChild(sheet);
  }

  document.addEventListener("click", (e) => {
    // Drill close button (inside the sheet)
    if (e.target.closest("[data-mv2-drill-close]")) {
      e.stopPropagation();
      mv2CloseDrill();
      return;
    }
    // Scrim — tap outside to close
    if (e.target.id === "mv2-scrim") {
      mv2CloseDrill();
      return;
    }
    // Panel row drill — only when the parent card is OPEN. When closed,
    // we want the click to fall through to the card-toggle handler so
    // the angler can tap anywhere on a collapsed card to expand it.
    const drillRow = e.target.closest("[data-mv2-drill]");
    if (drillRow) {
      const parentCard = drillRow.closest(".mv2-card");
      if (parentCard && parentCard.classList.contains("open")) {
        e.stopPropagation();
        try {
          const payload = JSON.parse(decodeURIComponent(drillRow.dataset.mv2Drill));
          mv2OpenDrill(payload);
        } catch (err) {
          console.error("mv2: drill payload parse failed", err);
        }
        return;
      }
      // else: fall through to card-toggle so collapsed card still expands
    }
    // Swipe arrows
    const swipeBtn = e.target.closest("[data-mv2-swipe]");
    if (swipeBtn) {
      e.stopPropagation();
      const card = swipeBtn.closest(".mv2-card");
      if (!card) return;
      const dir = swipeBtn.dataset.mv2Swipe;
      mv2StepHero(card, dir);
      return;
    }
    // Card-body tap to toggle open/closed
    const card = e.target.closest(".mv2-card[data-mv2-card]");
    if (!card) return;
    if (card.classList.contains("radar")) return;
    card.classList.toggle("open");
  });

  // Touch-swipe on the hero area
  let touchStartX = null;
  let touchCard = null;
  document.addEventListener("touchstart", (e) => {
    const wrap = e.target.closest(".mv2-hero-wrap");
    if (!wrap) return;
    const card = wrap.closest(".mv2-card");
    if (!card || card.classList.contains("radar")) return;
    touchStartX = e.touches[0].clientX;
    touchCard = card;
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (touchStartX === null || !touchCard) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) {
      mv2StepHero(touchCard, dx < 0 ? "next" : "prev");
    }
    touchStartX = null;
    touchCard = null;
  });
}

function mv2StepHero(card, dir) {
  const cur   = parseInt(card.dataset.mv2HeroIdx || "0", 10);
  const count = parseInt(card.dataset.mv2HeroCount || "1", 10);
  const next  = dir === "next" ? Math.min(cur + 1, count - 1) : Math.max(cur - 1, 0);
  if (next === cur) return;

  card.dataset.mv2HeroIdx = String(next);
  const track = card.querySelector(".mv2-hero-track");
  if (track) track.style.transform = `translateX(-${next * 100}%)`;

  // Refresh dots and arrow-disabled states
  const dots = card.querySelectorAll(".mv2-swipe-dot");
  dots.forEach((d, i) => d.classList.toggle("on", i === next));
  const prevBtn = card.querySelector('[data-mv2-swipe="prev"]');
  const nextBtn = card.querySelector('[data-mv2-swipe="next"]');
  if (prevBtn) prevBtn.disabled = (next === 0);
  if (nextBtn) nextBtn.disabled = (next === count - 1);
}

/**
 * Open the drill-down sheet for one field. payload = {cardKey, label,
 * value, unit}. The sheet shows the current value front-and-center plus
 * a "history coming soon" placeholder for the chart blocks — backend
 * doesn't surface 24h history yet. Once it does (queued task), the
 * placeholders swap to real charts here.
 */
function mv2OpenDrill(payload) {
  const sheet = document.getElementById("mv2-drill-sheet");
  const scrim = document.getElementById("mv2-scrim");
  if (!sheet || !scrim) return;

  const label = payload.label || "";
  const value = payload.value;
  const unit  = payload.unit || "";
  const empty = (value === null || value === undefined || value === "");

  const currentBlock = empty
    ? `<div class="mv2-drill-current" style="font-size:22px;font-style:italic;color:#64748b;background:none;-webkit-text-fill-color:#64748b">no live data</div>`
    : `<div class="mv2-drill-current">${escapeHtml(String(value))}` +
      (unit ? `<span class="u">${escapeHtml(unit)}</span>` : "") +
      `</div>`;

  // History blocks — explicit "not yet available" rather than fabricated.
  // When backend wires real 24h history (queued task), replace these
  // .mv2-drill-placeholder blocks with the actual chart renderers.
  const historyBlocks = empty
    ? `<div class="mv2-drill-note"><span>📭</span>
         <span>This field has no live data right now. When the feed
         comes back, history will populate here.</span></div>`
    : `
      <div class="mv2-drill-section">
        <div class="mv2-drill-section-title">Last 24 hours</div>
        <div class="mv2-drill-placeholder">
          <span class="em">📊</span>
          Historical trend coming soon — we're wiring real USGS / Open-Meteo
          history data so this chart shows the last 24 hours of ${escapeHtml(label.toLowerCase())}.
        </div>
      </div>
      <div class="mv2-drill-section">
        <div class="mv2-drill-section-title">Yesterday vs today</div>
        <div class="mv2-drill-placeholder">
          <span class="em">⏱</span>
          Yesterday's reading will compare against today's once the
          history feed is online.
        </div>
      </div>
      <div class="mv2-drill-section">
        <div class="mv2-drill-section-title">Last 7 days</div>
        <div class="mv2-drill-placeholder">
          <span class="em">📅</span>
          Week trend coming soon.
        </div>
      </div>`;

  // Banner uses the SAME art the card uses — Phase H/I/J skin picker
  // will swap them together. Pass cardKey through mv2GetCardArt so any
  // future per-card or per-user override is honored here automatically.
  // TODO(Phase J): when photo cycling ships, decide whether the banner
  // cycles independently from the card or shares the frame index. For
  // now they share the same static image (the active skin).
  const bannerArt = mv2GetCardArt(payload.cardKey, null);

  sheet.innerHTML = `
    <div class="grip"></div>
    <div class="mv2-drill-art">
      <img src="${escapeHtml(bannerArt)}" alt=""
           onerror="this.style.display='none'">
      <div class="mv2-drill-fv-wrap">
        <img class="mv2-drill-fv" src="assets/logo-black.png" alt="">
      </div>
    </div>
    <div class="mv2-drill-head">
      <div>
        <div class="mv2-drill-title">${escapeHtml(label)}</div>
        ${currentBlock}
      </div>
      <button class="mv2-drill-close" data-mv2-drill-close type="button" aria-label="Close">✕</button>
    </div>
    ${historyBlocks}
  `;

  sheet.classList.add("on");
  scrim.classList.add("on");
}

function mv2CloseDrill() {
  const sheet = document.getElementById("mv2-drill-sheet");
  const scrim = document.getElementById("mv2-scrim");
  if (sheet) sheet.classList.remove("on");
  if (scrim) scrim.classList.remove("on");
}

// ───────────────────────────────────────────────────────────────────
// Dispatcher: pick v6 cards when backend says so, else fall through
// to the legacy renderer. Preserves the v1 path so an old frontend
// loaded mid-deploy keeps working.
// ───────────────────────────────────────────────────────────────────
function renderConditionsCard(bundle) {
  if (!bundle) return "";
  if (bundle.card_schema_version === 2 && bundle.card_v2) {
    return renderConditionsCardV2(bundle);
  }
  return renderConditionsCardV1(bundle);
}

function renderConditionsCardV1(bundle) {
  // bundle is the full get_hatch_conditions result: {location, raw, factors,
  // sources, missing, ...}. We pull the raw values for honest display —
  // the model narrates from them in its prose, and the user sees the same
  // numbers here. No fabricated data possible.
  const loc = bundle.location || {};
  const raw = bundle.raw || {};
  const w = raw.weather || {};
  const water = raw.water || {};
  const air = raw.air_quality || {};
  const astro = raw.astronomy || {};
  const missing = bundle.missing || [];

  const cells = [];
  const addCell = (label, value, sub, trendClass) => {
    if (value === null || value === undefined || value === "") return;
    const cls = trendClass ? ` ${trendClass}` : "";
    cells.push(
      `<div class="cond-cell"><div class="label">${escapeHtml(label)}</div>` +
      `<div class="value${cls}">${escapeHtml(String(value))}</div>` +
      (sub ? `<div class="sub">${escapeHtml(sub)}</div>` : "") +
      `</div>`
    );
  };

  // Water column
  if (water.water_temp_f != null) addCell("Water temp", water.water_temp_f.toFixed(1) + "°F");
  if (water.flow_cfs != null) addCell("Flow", Math.round(water.flow_cfs) + " CFS",
                                       water.gauge_height_ft != null ? water.gauge_height_ft.toFixed(2) + " ft gauge" : null);

  // Air column
  if (w.air_temp_f != null) {
    const sub = (w.air_temp_rate_f_per_hr != null)
      ? `${w.air_temp_rate_f_per_hr >= 0 ? "+" : ""}${w.air_temp_rate_f_per_hr.toFixed(1)}°/hr`
      : null;
    addCell("Air temp", w.air_temp_f.toFixed(0) + "°F", sub);
  }
  if (w.humidity_pct != null) addCell("Humidity", Math.round(w.humidity_pct) + "%");
  if (w.wind_mph != null) addCell("Wind", w.wind_mph.toFixed(1) + " mph");
  if (w.uv_index != null) addCell("UV index", w.uv_index.toFixed(1));

  // Pressure with trend arrow
  if (w.baro_trend_3day_inHg != null) {
    const sign = w.baro_trend_3day_inHg >= 0 ? "+" : "";
    const trendClass = w.baro_trend_label === "rising" ? "cond-trend-up"
                     : w.baro_trend_label === "falling" ? "cond-trend-down"
                     : "cond-trend-steady";
    addCell("Pressure (3-day)", sign + w.baro_trend_3day_inHg.toFixed(2) + " inHg",
            w.baro_trend_label || null, trendClass);
  }
  if (w.precip_history_in_7day != null) {
    addCell("Precip (7-day)", w.precip_history_in_7day.toFixed(2) + " in");
  }

  // Air quality
  if (air.aqi != null) addCell("AQI", air.aqi, air.category || null);

  // Astronomy
  if (astro.sunrise_local) addCell("Sunrise", astro.sunrise_local,
                                    astro.sunset_local ? "set " + astro.sunset_local : null);
  if (astro.photoperiod_hours != null) addCell("Daylight", astro.photoperiod_hours.toFixed(1) + " hr");
  if (astro.moon_brightness_pct != null) addCell("Moon", Math.round(astro.moon_brightness_pct) + "%");

  const locLine = [loc.label, loc.state].filter(s => s && !(loc.label || "").includes(s)).join(", ");
  const asOf = bundle.as_of ? new Date(bundle.as_of).toLocaleString() : "";
  const missingNote = missing.length
    ? `<div class="cond-missing">Some sources didn't answer: ${escapeHtml(missing.join(", "))}.</div>`
    : "";

  return (
    `<div class="artifact">` +
      `<div class="artifact-header">` +
        `<div class="artifact-loc">${escapeHtml(loc.label || "Conditions")}` +
        (loc.state && !(loc.label || "").includes(loc.state) ? `, ${escapeHtml(loc.state)}` : "") +
        `</div>` +
        (asOf ? `<div class="artifact-asof">${escapeHtml(asOf)}</div>` : "") +
      `</div>` +
      `<div class="cond-grid">${cells.join("")}</div>` +
      missingNote +
    `</div>`
  );
}

function renderMapArtifact(payload) {
  // payload = {config, scoped_token, expires_in_s}. Returns a host div
  // immediately; the actual Mapbox map mounts asynchronously once we have
  // the token. If anything fails we fall back to a static text summary.
  const id = `midge-map-${++_artifactCounter}`;
  const config = payload.config || {};
  const loc = config.location || {};
  const center = config.center || {};
  const annotations = config.annotations || [];
  const overlays = config.overlays || [];
  const conditions = config.conditions;

  // Pre-attach conditions card from the bundle (saves a tool call).
  const condHtml = conditions ? renderConditionsCard(conditions) : "";

  const header =
    `<div class="artifact-header">` +
      `<div class="artifact-loc">${escapeHtml(loc.label || "Map")}` +
      (loc.state && !(loc.label || "").includes(loc.state) ? `, ${escapeHtml(loc.state)}` : "") +
      `</div>` +
      (annotations[1] ? `<div class="artifact-asof">${escapeHtml(annotations[1])}</div>` : "") +
    `</div>`;

  const overlayBar = overlays.length
    ? `<div class="map-overlays">` +
        overlays.map((o, i) =>
          `<button class="map-overlay-toggle${o.default_enabled ? " on" : ""}" ` +
          `data-overlay-id="${escapeHtml(o.id)}" data-map-id="${id}" type="button">` +
          escapeHtml(o.name || o.id) +
          `</button>`
        ).join("") +
      `</div>`
    : "";

  // Mount the map asynchronously — has to wait for the token fetch.
  setTimeout(() => mountMapboxMap(id, payload), 0);

  // Brookie banner — sits at the TOP of the artifact, above the
  // location-header strip and the map. Reads as the visual header
  // for the whole artifact, mirroring how each card has its own
  // brookie identity. Routes through mv2GetCardArt() so when Phase
  // H ships the skin picker, the map banner skins with the cards.
  // 'map' cardKey lets Phase H optionally give the map its own
  // skin slot (or reuse 'water').
  const bannerArt = (typeof mv2GetCardArt === "function")
    ? mv2GetCardArt("map", null) : "assets/brookie-art-1.png";
  const bannerHtml =
    `<div class="mv2-map-banner">` +
      `<img class="bg" src="${escapeHtml(bannerArt)}" alt=""` +
      ` onerror="this.style.display='none'">` +
      `<div class="fv-wrap"><img src="assets/logo-black.png" alt=""></div>` +
    `</div>`;

  return (
    `<div class="artifact">` +
      bannerHtml +
      header +
      `<div class="map-wrap"><div id="${id}" class="midge-map"></div></div>` +
      overlayBar +
    `</div>` +
    condHtml
  );
}

/**
 * Build a marker DOM element for the Mapbox map. The icon is keyed off
 * marker.type so anglers can read the map at a glance:
 *   usgs_gauge / wsc_gauge — circular blue tag with a gauge glyph
 *   requested_location     — amber drop pin (the angler-typed place)
 *   default                — legacy red drop (older map paths still here)
 * All SVG, no image dependencies. Anchored at the bottom so the tip
 * touches the actual lat/lon.
 */
function buildMidgeMarkerEl(m) {
  const el = document.createElement("div");
  el.className = "midge-marker midge-marker-" + (m.type || "default");
  el.style.cssText = "display:flex;align-items:flex-end;justify-content:center;line-height:0;cursor:pointer;";
  const t = m.type || "default";
  if (t === "usgs_gauge" || t === "wsc_gauge") {
    // Blue tag with a tiny ruler-style glyph. Reads as "instrument /
    // measurement point" without saying "USGS" in the icon.
    el.innerHTML = `
      <svg width="30" height="38" viewBox="0 0 30 38" xmlns="http://www.w3.org/2000/svg"
           style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.45))">
        <path d="M15 36 L4 18 A11 11 0 1 1 26 18 Z"
              fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="15" cy="14" r="6.5" fill="#ffffff"/>
        <line x1="15" y1="9.5" x2="15" y2="11" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="15" y1="17" x2="15" y2="18.5" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="10.5" y1="14" x2="12" y2="14" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="18" y1="14" x2="19.5" y2="14" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="15" y1="14" x2="17.5" y2="11.5" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
      </svg>`;
  } else if (t === "requested_location") {
    // Amber drop-pin — matches FlyVault accent. Says "you pointed here."
    el.innerHTML = `
      <svg width="30" height="38" viewBox="0 0 30 38" xmlns="http://www.w3.org/2000/svg"
           style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.45))">
        <path d="M15 36 L4 18 A11 11 0 1 1 26 18 Z"
              fill="#c9a87a" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="15" cy="14" r="5" fill="#ffffff"/>
      </svg>`;
  } else {
    // Legacy red drop (default marker behavior preserved).
    el.innerHTML = `
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"
           style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.45))">
        <path d="M14 34 L4 17 A10 10 0 1 1 24 17 Z"
              fill="#e24b4a" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="14" cy="13" r="4" fill="#ffffff"/>
      </svg>`;
  }
  return el;
}

async function mountMapboxMap(domId, payload) {
  const el = document.getElementById(domId);
  if (!el) return;

  if (typeof mapboxgl === "undefined") {
    el.outerHTML = `<div class="map-error">Mapbox couldn't load. Check your network and try again.</div>`;
    return;
  }

  // Token: prefer the scoped one minted by the subagent. If absent (no
  // MAPBOX_SECRET_TOKEN on Railway yet), try fetching from the backend's
  // /mapbox-token endpoint. If that also fails, show a graceful error.
  let token = payload.scoped_token;
  if (!token) {
    try {
      const tokenUrl = API.replace(/\/ask$/, "/mapbox-token");
      const r = await fetch(tokenUrl);
      if (r.ok) {
        const j = await r.json();
        token = j.token;
      }
    } catch (_) {
      // fall through to error below
    }
  }
  if (!token) {
    el.outerHTML = `<div class="map-error">Map unavailable — MAPBOX_SECRET_TOKEN isn't configured on the server yet.</div>`;
    return;
  }

  mapboxgl.accessToken = token;
  const config = payload.config || {};
  const center = config.center || {};
  const map = new mapboxgl.Map({
    container: domId,
    style: config.style_url || "mapbox://styles/mapbox/outdoors-v12",
    center: [center.lon || 0, center.lat || 0],
    zoom: config.zoom || 11,
  });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");

  // Markers — render different icons by marker.type so the angler can
  // instantly tell "this is where I asked about" vs "this is where the
  // data comes from." Three types today:
  //   usgs_gauge / wsc_gauge — gauge ruler icon, blue (data source)
  //   requested_location     — location pin, amber (what angler typed)
  //   default                — red drop (legacy / unspecified)
  const markers = config.markers || [];
  markers.forEach(m => {
    if (typeof m.lat !== "number" || typeof m.lon !== "number") return;
    const popupHtml = m.popup
      ? `<div style="font-size:12px;line-height:1.5">` +
        `<strong>${escapeHtml(m.label || "")}</strong><br>` +
        escapeHtml(m.popup).replace(/\n/g, "<br>") +
        `</div>`
      : `<div style="font-size:12px"><strong>${escapeHtml(m.label || "")}</strong></div>`;
    const el = buildMidgeMarkerEl(m);
    new mapboxgl.Marker({ element: el, anchor: "bottom" })
      .setLngLat([m.lon, m.lat])
      .setPopup(new mapboxgl.Popup({ offset: 18 }).setHTML(popupHtml))
      .addTo(map);
  });

  // Fit to bbox if available
  const bbox = config.bbox;
  if (bbox && typeof bbox.west === "number") {
    map.fitBounds(
      [[bbox.west, bbox.south], [bbox.east, bbox.north]],
      { padding: 36, duration: 0, maxZoom: 14 }
    );
  }

  // Wire overlay toggle buttons. v1: visual-only — flipping a toggle
  // marks it active. Actual layer rendering wires in here later when the
  // overlay tile sources are decided. The frontend contract is locked in
  // now so the rebuild can extend without changing the API.
  document.querySelectorAll(`.map-overlay-toggle[data-map-id="${domId}"]`).forEach(btn => {
    btn.addEventListener("click", () => {
      btn.classList.toggle("on");
      // TODO(rebuild): toggle map.setLayoutProperty(...) for each overlay
    });
  });
}

function renderArtifact(art) {
  if (!art || !art.type) return "";
  if (art.type === "map") return renderMapArtifact(art.data || {});
  if (art.type === "conditions") return renderConditionsCard(art.data || {});
  return "";
}
function addMsg(role, html, pending) {
  const div = document.createElement("div");
  div.className = "msg " + role + (pending ? " pending" : "");
  div.innerHTML = html;
  log.appendChild(div);
  canvas.scrollTop = canvas.scrollHeight;
  return div;
}
function showLog() {
  welcome.classList.add("hidden");
  log.classList.remove("hidden");
}

async function ask(question) {
  showLog();
  addMsg("user", render(question));
  const pending = addMsg("midge", "MIDGE is thinking…", true);
  send.disabled = true;
  try {
    const resp = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history, session_id: SESSION_ID })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const answer = data.answer || "(no answer returned)";
    pending.classList.remove("pending");

    // Compose the bubble: model's narration first, then any visual
    // artifacts (map or conditions card) the tool-calling loop produced.
    // The text leads — the visuals support it, never replace it.
    let html = render(answer);
    const artifacts = Array.isArray(data.artifacts) ? data.artifacts : [];
    for (const art of artifacts) {
      const block = renderArtifact(art);
      if (block) html += block;
    }
    pending.innerHTML = html;

    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: answer });
  } catch (e) {
    pending.classList.remove("pending");
    pending.innerHTML = `<span class="err">MIDGE is unreachable right now — try again in a moment. (${e.message})</span>`;
  } finally {
    send.disabled = false;
    q.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  q.style.height = "auto";
  ask(text);
});
q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 140) + "px";
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event("submit"));
  }
});

// Chip suggestions
document.getElementById("chips").addEventListener("click", e => {
  const btn = e.target.closest(".chip"); if (!btn) return;
  ask(btn.dataset.q);
});

// ── Boot ────────────────────────────────────────────────────
applyPrefs();
q.focus();
</script>
