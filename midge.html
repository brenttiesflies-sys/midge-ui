<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>MIDGE — FlyVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<!-- Mapbox GL JS — loaded eagerly so renderMap() can fire synchronously
     when an artifact arrives. Cheap if the page never renders a map. -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<style>
  /* ───────── Brand tokens (halo gradient stops) ───────── */
  :root {
    --halo-1: #8ec5a4;
    --halo-2: #c9a87a;
    --halo-3: #7faec0;
    --halo-4: #c98a7a;
    --halo-5: #b59ec4;
    --halo-6: #d4b88a;
  }

  /* Dark theme tokens (default) */
  body.dark {
    --bg:        #0b0b0d;
    --bg-elev:   #14141a;
    --bg-soft:   #1c1c24;
    --text:      #e9e8e3;
    --text-soft: #9a9994;
    --text-faint:#5a5953;
    --border:    #25252e;
    --accent:    #c9a87a;
    --user-bubble: #1f1f28;
    --disc:      #14141a;
    --halo-opacity: 0.6;
  }

  /* Light theme tokens */
  body.light {
    --bg:        #f6f3ee;
    --bg-elev:   #ffffff;
    --bg-soft:   #efeae2;
    --text:      #16140f;
    --text-soft: #5e5b53;
    --text-faint:#a09c92;
    --border:    #e6dfd2;
    --accent:    #7a5a3a;
    --user-bubble: #ece5d6;
    --disc:      #ffffff;
    --halo-opacity: 0.75;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .wrap {
    height: 100dvh;       /* dynamic vh — handles mobile keyboard */
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    padding: 0;
  }

  /* ───────── Header bar ───────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    z-index: 10;
  }

  /* When hand=right (default), .left holds back-button, .right holds menu */
  /* When hand=left, the flex order is reversed via body.hand-left class */
  body.hand-left header { flex-direction: row-reverse; }

  .back-vault {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .back-vault:hover {
    color: var(--text);
    border-color: var(--text-soft);
  }
  .vault-door {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 4px, var(--accent) 4px 5px, transparent 5px 7px, var(--accent) 7px 8px, transparent 8px);
    border: 1.5px solid var(--accent);
    position: relative;
    flex-shrink: 0;
  }
  .vault-door::after {
    content: "";
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
  }

  .menu-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  .menu-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
  }

  /* ───────── Main canvas ───────── */
  main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 18px;
    -webkit-overflow-scrolling: touch;
  }

  /* Welcome state */
  .welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .welcome.hidden { display: none; }

  .logo-wrap {
    position: relative;
    width: 168px;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  /* Halo: steady rotating gradient ring */
  .halo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 2px;
    background: conic-gradient(
      from 0deg,
      var(--halo-1),
      var(--halo-2),
      var(--halo-3),
      var(--halo-4),
      var(--halo-5),
      var(--halo-6),
      var(--halo-1)
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: var(--halo-opacity);
    animation: spin 24s linear infinite;
  }
  .halo::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: inherit;
    filter: blur(12px);
    opacity: 0.45;
    z-index: -1;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  body.halo-off .halo { display: none; }

  .logo-disc {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: var(--disc);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-disc img {
    width: 92px;
    height: 92px;
    object-fit: contain;
  }

  .welcome h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: 0.2px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .welcome .sub {
    color: var(--text-soft);
    font-size: 14px;
    margin-bottom: 22px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 520px;
    margin: 0 auto;
  }
  .chip {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .chip:hover { border-color: var(--accent); }

  /* Conversation state */
  .log {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .log.hidden { display: none; }

  .msg {
    padding: 12px 14px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 15px;
    max-width: 92%;
    border: 1px solid var(--border);
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--user-bubble);
    align-self: flex-end;
  }
  .msg.midge {
    background: var(--bg-elev);
    align-self: flex-start;
  }
  .msg img {
    max-width: 100%;
    border-radius: 8px;
    margin: 8px 0;
    display: block;
  }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg strong { color: var(--accent); }
  .pending { color: var(--text-faint); font-style: italic; }
  .err { color: #e08a5a; font-size: 13px; }

  /* ───────── Composer ───────── */
  footer {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  form#composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea#q {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    resize: none;
    min-height: 46px;
    max-height: 140px;
    outline: none;
  }
  textarea#q:focus { border-color: var(--accent); }
  button#send {
    background: var(--accent);
    border: none;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    padding: 0 18px;
    height: 46px;
    border-radius: 12px;
    cursor: pointer;
  }
  body.light button#send { color: #fff; }
  button#send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ───────── Menu drawer ───────── */
  .drawer {
    position: fixed;
    top: 60px;
    right: 14px;
    width: min(320px, calc(100vw - 28px));
    max-height: calc(100dvh - 80px);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    overflow-y: auto;
    z-index: 50;
    transform: translateY(-8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  body.hand-left .drawer {
    right: auto;
    left: 14px;
  }
  .drawer.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .drawer-header {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    padding: 16px 18px 10px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .drawer-section { padding: 6px 0; }
  .drawer-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 14px;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 18px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
    color: var(--text);
  }
  .drawer-item:hover { background: var(--bg-soft); }
  .drawer-item .label { font-size: 14px; font-weight: 500; }
  .drawer-item .ctrl  { font-size: 12px; color: var(--text-soft); display: flex; align-items: center; gap: 8px; }

  /* Color swatch: wraps a real <input type="color"> so taps go straight
     to the native picker. The visible swatch is a sibling div sized to
     match. Avoids the cross-browser pain of trying to .click() a hidden input. */
  .swatch-wrap {
    position: relative;
    width: 26px;
    height: 26px;
  }
  .swatch-wrap input[type="color"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
    background: transparent;
    z-index: 2;
  }
  .swatch {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--border);
    pointer-events: none;     /* taps fall through to the input above */
    z-index: 1;
  }

  /* Toggle pill (L—R, halo on/off, light/dark) */
  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px;
    gap: 0;
    font-size: 12px;
    font-weight: 600;
  }
  .pill button {
    border: none;
    background: transparent;
    color: var(--text-faint);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    min-width: 30px;
  }
  .pill button.on {
    background: #6fae7d;
    color: #fff;
  }

  /* Logo picker (3 small previews) */
  .logo-picker {
    display: flex;
    gap: 8px;
  }
  .logo-opt {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .logo-opt.on { border-color: var(--accent); }
  .logo-opt img { width: 18px; height: 18px; object-fit: contain; }

  /* Reset button row */
  .reset-row {
    padding: 12px 18px 16px;
  }
  .reset-row button {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .reset-row button:hover { border-color: var(--accent); color: var(--accent); }

  /* ───────── Training modal ───────── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
    padding: 20px;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 22px 18px;
    max-width: 360px;
    width: 100%;
    position: relative;
    color: var(--text);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    margin-bottom: 8px;
    padding-right: 30px;
  }
  .modal p {
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.5;
  }
  .modal .x {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    border-radius: 8px;
    line-height: 1;
  }
  .modal .x:hover { background: var(--bg-soft); color: var(--text); }

  /* ── Inline artifacts: conditions card + Mapbox map ──────────── */
  .artifact {
    margin: 12px 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-soft);
    overflow: hidden;
  }
  .artifact-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .artifact-loc { font-weight: 600; font-size: 14px; }
  .artifact-asof { font-size: 11px; color: var(--text-soft); }

  /* Conditions card */
  .cond-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    padding: 12px 14px;
  }
  .cond-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .cond-cell .label {
    font-size: 11px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .cond-cell .value {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.1;
  }
  .cond-cell .sub {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 3px;
  }
  .cond-trend-up::after   { content: " ↑"; color: #2dba4e; }
  .cond-trend-down::after { content: " ↓"; color: #d63838; }
  .cond-trend-steady::after { content: " →"; color: var(--text-soft); }
  .cond-missing {
    padding: 8px 14px 12px;
    font-size: 11px;
    color: var(--text-soft);
    font-style: italic;
  }

  /* Map */
  .map-wrap { padding: 0; }
  .midge-map {
    width: 100%;
    height: 260px;
    background: #1a1f1d;
  }
  .map-overlays {
    padding: 8px 14px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
  }
  .map-overlay-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11px;
    cursor: pointer;
    line-height: 1.2;
  }
  .map-overlay-toggle.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .map-error {
    padding: 14px;
    font-size: 12px;
    color: var(--text-soft);
  }

  /* Mobile narrowing */
  @media (max-width: 540px) {
    .welcome h1 { font-size: 22px; }
    .chip { font-size: 12px; padding: 7px 12px; }
    .drawer { top: 56px; }
    .midge-map { height: 220px; }
    .cond-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body class="dark hand-right">

<div class="wrap">

  <header>
    <a class="back-vault" id="backVault" href="https://flyvault.net/" data-train="back-vault">
      <span class="vault-door" aria-hidden="true"></span>
      <span>Back to the Vault</span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" data-train="menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main id="canvas">
    <!-- Welcome state -->
    <div class="welcome" id="welcome">
      <div class="logo-wrap">
        <div class="halo" aria-hidden="true"></div>
        <div class="logo-disc">
          <img id="logoImg" src="assets/logo-silver.png" alt="MIDGE logo">
        </div>
      </div>
      <h1>Talk to MIDGE</h1>
      <div class="sub">What do we need to tackle today?</div>
      <!-- Suggested chips — hidden for launch, restore before wider release
      <div class="chips" id="chips">
        <button class="chip" data-q="Tell me about the Greensleeves">Tell me about the Greensleeves</button>
        <button class="chip" data-q="Show me a Black Doctor">Show me a Black Doctor</button>
        <button class="chip" data-q="What's a good early-spring midge pattern?">Good early-spring midge?</button>
        <button class="chip" data-q="Who tied the Royal Wulff?">Who tied the Royal Wulff?</button>
      </div>
      -->
      <div class="chips" id="chips" style="display:none"></div>
    </div>

    <!-- Conversation state -->
    <div class="log hidden" id="log"></div>
  </main>

  <footer>
    <form id="composer">
      <textarea id="q" placeholder="Ask MIDGE about a pattern, hatch, or water…" rows="1" autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>

</div>

<!-- Menu drawer -->
<aside class="drawer" id="drawer" aria-label="My Midge menu">
  <div class="drawer-header">My Midge</div>

  <div class="drawer-section">
    <!-- My Logo -->
    <div class="drawer-item" data-train="my-logo">
      <span class="label">My Logo</span>
      <span class="ctrl logo-picker" id="logoPicker">
        <button class="logo-opt on" data-logo="assets/logo-silver.png" title="Silver"><img src="assets/logo-silver.png" alt=""></button>
        <button class="logo-opt"    data-logo="assets/logo-white.png"  title="White"><img src="assets/logo-white.png"  alt=""></button>
        <button class="logo-opt"    data-logo="assets/logo-black.png"  title="Black"><img src="assets/logo-black.png"  alt=""></button>
      </span>
    </div>

    <!-- My Background -->
    <div class="drawer-item" data-train="my-bg" id="bgRow">
      <span class="label">My Background</span>
      <span class="ctrl">
        <span class="swatch-wrap">
          <input type="color" id="bgInput" aria-label="Background color">
          <span class="swatch" id="bgSwatch"></span>
        </span>
      </span>
    </div>

    <!-- My Words / Text -->
    <div class="drawer-item" data-train="my-words" id="textRow">
      <span class="label">My Words / Text</span>
      <span class="ctrl">
        <span class="swatch-wrap">
          <input type="color" id="textInput" aria-label="Text color">
          <span class="swatch" id="textSwatch"></span>
        </span>
      </span>
    </div>

    <!-- Behind My Logo -->
    <div class="drawer-item" data-train="behind-logo" id="discRow">
      <span class="label">Behind My Logo</span>
      <span class="ctrl">
        <span class="swatch-wrap">
          <input type="color" id="discInput" aria-label="Disc color">
          <span class="swatch" id="discSwatch"></span>
        </span>
      </span>
    </div>

    <!-- My Halo -->
    <div class="drawer-item" data-train="my-halo">
      <span class="label">My Halo</span>
      <span class="ctrl">
        <span class="pill" id="haloPill">
          <button data-halo="on"  class="on">On</button>
          <button data-halo="off">Off</button>
        </span>
      </span>
    </div>

    <!-- Light / Dark -->
    <div class="drawer-item" data-train="theme">
      <span class="label">Light / Dark</span>
      <span class="ctrl">
        <span class="pill" id="themePill">
          <button data-theme="dark" class="on">Dark</button>
          <button data-theme="light">Light</button>
        </span>
      </span>
    </div>

    <!-- My Hand -->
    <div class="drawer-item" data-train="my-hand">
      <span class="label">My Hand</span>
      <span class="ctrl">
        <span class="pill" id="handPill">
          <button data-hand="left">L</button>
          <button data-hand="right" class="on">R</button>
        </span>
      </span>
    </div>
  </div>

  <div class="reset-row">
    <button id="resetBtn" data-train="reset">Reset</button>
  </div>
</aside>

<!-- Training modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="x" id="modalX" aria-label="Close">×</button>
    <h3 id="modalTitle">…</h3>
    <p id="modalBody">…</p>
  </div>
</div>

<script>
/* ────────────────────────────────────────────────────────────
   MIDGE 2.0 — wired chat page
   - Talks to Railway /ask
   - All My-Midge customizations persisted via localStorage
   - Training-modal first-tap layer (toggle via window.MIDGE_TRAINING)
   ──────────────────────────────────────────────────────────── */

const API = "https://midge-backend-production.up.railway.app/ask";

// ── Session ID (carries sticky tyer across turns) ───────────
function makeSessionId() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c/4)).toString(16));
}
const SESSION_ID = (() => {
  try {
    let id = sessionStorage.getItem("midge_session_id");
    if (!id) { id = makeSessionId(); sessionStorage.setItem("midge_session_id", id); }
    return id;
  } catch { return makeSessionId(); }
})();

// ── Training-wheels modal map ───────────────────────────────
// Update copy here. Set window.MIDGE_TRAINING=false to disable globally.
window.MIDGE_TRAINING = true;
const TRAINING = {
  "menu":         { title: "My Midge menu",        body: "Open this to change how MIDGE looks. Logo, colors, halo, and which side things sit on." },
  "back-vault":   { title: "Back to the Vault",    body: "Tap to leave MIDGE and return to FlyVault." },
  "my-logo":      { title: "My Logo",              body: "Pick one of three logos. Silver, white, or black." },
  "my-bg":        { title: "My Background",        body: "Change the color of the page behind everything." },
  "my-words":     { title: "My Words / Text",      body: "Change the color of the writing on the page." },
  "behind-logo":  { title: "Behind My Logo",       body: "Change the circle that sits behind your logo." },
  "my-halo":      { title: "My Halo",              body: "Turn the ring of light around your logo on or off." },
  "theme":        { title: "Light or Dark",        body: "Pick a starting look. Light is warm and bright. Dark is calm and quiet. You can change any color from there." },
  "my-hand":      { title: "My Hand",              body: "Pick which side of the screen your menu sits on. R for right-handed (default). L for left-handed — your menu moves to the left, the Vault button moves to the right." },
  "reset":        { title: "Reset",                body: "Put everything back to default." }
};
const seenTrainingKey = "midge_training_seen";
function getSeen() { try { return JSON.parse(localStorage.getItem(seenTrainingKey) || "{}"); } catch { return {}; } }
function markSeen(k) { const s = getSeen(); s[k]=1; try{ localStorage.setItem(seenTrainingKey, JSON.stringify(s)); }catch{} }

const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
function showTraining(key) {
  const t = TRAINING[key];
  if (!t) return false;
  modalTitle.textContent = t.title;
  modalBody.textContent  = t.body;
  modalBackdrop.classList.add("open");
  return true;
}
function closeModal() { modalBackdrop.classList.remove("open"); }
document.getElementById("modalX").addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", e => { if (e.target === modalBackdrop) closeModal(); });

// Intercept first-tap on any [data-train] element
document.addEventListener("click", e => {
  if (!window.MIDGE_TRAINING) return;
  const el = e.target.closest("[data-train]");
  if (!el) return;
  const key = el.dataset.train;
  const seen = getSeen();
  if (!seen[key]) {
    e.preventDefault();
    e.stopPropagation();
    if (showTraining(key)) markSeen(key);
  }
}, true);  // capture phase so we intercept before the actual handler

// ── Preferences (persisted) ─────────────────────────────────
const PREFS_KEY = "midge_prefs_v1";
const DEFAULT_PREFS = {
  theme: "dark",
  hand: "right",
  halo: "on",
  logo: "assets/logo-silver.png",
  bg: null, text: null, disc: null,  // null = use theme default
};
function loadPrefs() {
  try { return Object.assign({}, DEFAULT_PREFS, JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); }
  catch { return Object.assign({}, DEFAULT_PREFS); }
}
function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {} }
let prefs = loadPrefs();

function applyPrefs() {
  // Theme
  document.body.classList.toggle("dark",  prefs.theme === "dark");
  document.body.classList.toggle("light", prefs.theme === "light");
  // Hand
  document.body.classList.toggle("hand-right", prefs.hand === "right");
  document.body.classList.toggle("hand-left",  prefs.hand === "left");
  // Halo
  document.body.classList.toggle("halo-off", prefs.halo === "off");
  // Logo
  document.getElementById("logoImg").src = prefs.logo;
  document.querySelectorAll(".logo-opt").forEach(b =>
    b.classList.toggle("on", b.dataset.logo === prefs.logo));
  // Color overrides (or clear)
  setVar("--bg", prefs.bg);
  setVar("--text", prefs.text);
  setVar("--disc", prefs.disc);
  // Pills
  setPill("themePill", "data-theme", prefs.theme);
  setPill("haloPill",  "data-halo",  prefs.halo);
  setPill("handPill",  "data-hand",  prefs.hand);
  // Swatches
  setSwatch("bgSwatch",   getEffective("--bg"));
  setSwatch("textSwatch", getEffective("--text"));
  setSwatch("discSwatch", getEffective("--disc"));
}
function setVar(name, value) {
  if (value) document.body.style.setProperty(name, value);
  else       document.body.style.removeProperty(name);
}
function getEffective(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}
function setPill(id, attr, val) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle("on", b.getAttribute(attr) === val));
}
function setSwatch(id, color) {
  document.getElementById(id).style.background = color;
}

// ── Menu drawer open/close ──────────────────────────────────
const drawer = document.getElementById("drawer");
const menuBtn = document.getElementById("menuBtn");
function openDrawer() { drawer.classList.add("open"); }
function closeDrawer() { drawer.classList.remove("open"); }
menuBtn.addEventListener("click", e => {
  // training-wheels for the menu fires first via capture phase; if it fired, training will preventDefault.
  if (drawer.classList.contains("open")) closeDrawer(); else openDrawer();
});
document.addEventListener("click", e => {
  if (drawer.contains(e.target) || menuBtn.contains(e.target)) return;
  if (drawer.classList.contains("open")) closeDrawer();
});

// ── Drawer pill handlers ────────────────────────────────────
document.getElementById("themePill").addEventListener("click", e => {
  const v = e.target.dataset.theme; if (!v) return;
  prefs.theme = v; savePrefs(prefs); applyPrefs();
});
document.getElementById("haloPill").addEventListener("click", e => {
  const v = e.target.dataset.halo; if (!v) return;
  prefs.halo = v; savePrefs(prefs); applyPrefs();
});
document.getElementById("handPill").addEventListener("click", e => {
  const v = e.target.dataset.hand; if (!v) return;
  prefs.hand = v; savePrefs(prefs); applyPrefs();
});

// Logo picker
document.getElementById("logoPicker").addEventListener("click", e => {
  const btn = e.target.closest(".logo-opt"); if (!btn) return;
  prefs.logo = btn.dataset.logo; savePrefs(prefs); applyPrefs();
});

// Color rows — the native <input type="color"> sits ON TOP of the swatch
// inside .swatch-wrap, so a tap opens the picker directly. We just keep
// its initial value in sync with the current effective color and listen
// for changes.
function wireColor(inputId, prefKey, cssVar) {
  const input = document.getElementById(inputId);
  // Set initial value before the user opens the picker
  function syncValue() {
    input.value = rgbToHex(getEffective(cssVar)) || "#000000";
  }
  syncValue();
  input.addEventListener("focus", syncValue);
  input.addEventListener("click", syncValue);
  input.addEventListener("input", () => {
    prefs[prefKey] = input.value;
    savePrefs(prefs);
    applyPrefs();
  });
}
wireColor("bgInput",   "bg",   "--bg");
wireColor("textInput", "text", "--text");
wireColor("discInput", "disc", "--disc");

function rgbToHex(rgb) {
  if (!rgb) return null;
  if (rgb.startsWith("#")) return rgb;
  const m = rgb.match(/\d+/g);
  if (!m) return null;
  return "#" + m.slice(0,3).map(n => parseInt(n).toString(16).padStart(2,"0")).join("");
}

// Reset
document.getElementById("resetBtn").addEventListener("click", () => {
  prefs = Object.assign({}, DEFAULT_PREFS);
  savePrefs(prefs);
  applyPrefs();
});

// ── Chat plumbing ───────────────────────────────────────────
const canvas = document.getElementById("canvas");
const welcome = document.getElementById("welcome");
const log = document.getElementById("log");
const form = document.getElementById("composer");
const q = document.getElementById("q");
const send = document.getElementById("send");
const history = [];

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function render(text) {
  let t = escapeHtml(text);
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => `<img src="${url}" alt="${alt}">`);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
  return "<p>" + t + "</p>";
}

/* ─────── Inline artifact renderers ─────────────────────────────
   Backend's /ask response now includes an `artifacts` array. Each
   entry is {type, data}. Map artifacts produce a live Mapbox view;
   conditions artifacts produce a weather-app-style card. Both render
   below the model's narration text in the same chat bubble.
*/

// Used to suffix DOM ids so multiple maps in the same chat don't collide.
let _artifactCounter = 0;

function renderConditionsCard(bundle) {
  // bundle is the full get_hatch_conditions result: {location, raw, factors,
  // sources, missing, ...}. We pull the raw values for honest display —
  // the model narrates from them in its prose, and the user sees the same
  // numbers here. No fabricated data possible.
  const loc = bundle.location || {};
  const raw = bundle.raw || {};
  const w = raw.weather || {};
  const water = raw.water || {};
  const air = raw.air_quality || {};
  const astro = raw.astronomy || {};
  const missing = bundle.missing || [];

  const cells = [];
  const addCell = (label, value, sub, trendClass) => {
    if (value === null || value === undefined || value === "") return;
    const cls = trendClass ? ` ${trendClass}` : "";
    cells.push(
      `<div class="cond-cell"><div class="label">${escapeHtml(label)}</div>` +
      `<div class="value${cls}">${escapeHtml(String(value))}</div>` +
      (sub ? `<div class="sub">${escapeHtml(sub)}</div>` : "") +
      `</div>`
    );
  };

  // Water column
  if (water.water_temp_f != null) addCell("Water temp", water.water_temp_f.toFixed(1) + "°F");
  if (water.flow_cfs != null) addCell("Flow", Math.round(water.flow_cfs) + " CFS",
                                       water.gauge_height_ft != null ? water.gauge_height_ft.toFixed(2) + " ft gauge" : null);

  // Air column
  if (w.air_temp_f != null) {
    const sub = (w.air_temp_rate_f_per_hr != null)
      ? `${w.air_temp_rate_f_per_hr >= 0 ? "+" : ""}${w.air_temp_rate_f_per_hr.toFixed(1)}°/hr`
      : null;
    addCell("Air temp", w.air_temp_f.toFixed(0) + "°F", sub);
  }
  if (w.humidity_pct != null) addCell("Humidity", Math.round(w.humidity_pct) + "%");
  if (w.wind_mph != null) addCell("Wind", w.wind_mph.toFixed(1) + " mph");
  if (w.uv_index != null) addCell("UV index", w.uv_index.toFixed(1));

  // Pressure with trend arrow
  if (w.baro_trend_3day_inHg != null) {
    const sign = w.baro_trend_3day_inHg >= 0 ? "+" : "";
    const trendClass = w.baro_trend_label === "rising" ? "cond-trend-up"
                     : w.baro_trend_label === "falling" ? "cond-trend-down"
                     : "cond-trend-steady";
    addCell("Pressure (3-day)", sign + w.baro_trend_3day_inHg.toFixed(2) + " inHg",
            w.baro_trend_label || null, trendClass);
  }
  if (w.precip_history_in_7day != null) {
    addCell("Precip (7-day)", w.precip_history_in_7day.toFixed(2) + " in");
  }

  // Air quality
  if (air.aqi != null) addCell("AQI", air.aqi, air.category || null);

  // Astronomy
  if (astro.sunrise_local) addCell("Sunrise", astro.sunrise_local,
                                    astro.sunset_local ? "set " + astro.sunset_local : null);
  if (astro.photoperiod_hours != null) addCell("Daylight", astro.photoperiod_hours.toFixed(1) + " hr");
  if (astro.moon_brightness_pct != null) addCell("Moon", Math.round(astro.moon_brightness_pct) + "%");

  const locLine = [loc.label, loc.state].filter(s => s && !(loc.label || "").includes(s)).join(", ");
  const asOf = bundle.as_of ? new Date(bundle.as_of).toLocaleString() : "";
  const missingNote = missing.length
    ? `<div class="cond-missing">Some sources didn't answer: ${escapeHtml(missing.join(", "))}.</div>`
    : "";

  return (
    `<div class="artifact">` +
      `<div class="artifact-header">` +
        `<div class="artifact-loc">${escapeHtml(loc.label || "Conditions")}` +
        (loc.state && !(loc.label || "").includes(loc.state) ? `, ${escapeHtml(loc.state)}` : "") +
        `</div>` +
        (asOf ? `<div class="artifact-asof">${escapeHtml(asOf)}</div>` : "") +
      `</div>` +
      `<div class="cond-grid">${cells.join("")}</div>` +
      missingNote +
    `</div>`
  );
}

function renderMapArtifact(payload) {
  // payload = {config, scoped_token, expires_in_s}. Returns a host div
  // immediately; the actual Mapbox map mounts asynchronously once we have
  // the token. If anything fails we fall back to a static text summary.
  const id = `midge-map-${++_artifactCounter}`;
  const config = payload.config || {};
  const loc = config.location || {};
  const center = config.center || {};
  const annotations = config.annotations || [];
  const overlays = config.overlays || [];
  const conditions = config.conditions;

  // Pre-attach conditions card from the bundle (saves a tool call).
  const condHtml = conditions ? renderConditionsCard(conditions) : "";

  const header =
    `<div class="artifact-header">` +
      `<div class="artifact-loc">${escapeHtml(loc.label || "Map")}` +
      (loc.state && !(loc.label || "").includes(loc.state) ? `, ${escapeHtml(loc.state)}` : "") +
      `</div>` +
      (annotations[1] ? `<div class="artifact-asof">${escapeHtml(annotations[1])}</div>` : "") +
    `</div>`;

  const overlayBar = overlays.length
    ? `<div class="map-overlays">` +
        overlays.map((o, i) =>
          `<button class="map-overlay-toggle${o.default_enabled ? " on" : ""}" ` +
          `data-overlay-id="${escapeHtml(o.id)}" data-map-id="${id}" type="button">` +
          escapeHtml(o.name || o.id) +
          `</button>`
        ).join("") +
      `</div>`
    : "";

  // Mount the map asynchronously — has to wait for the token fetch.
  setTimeout(() => mountMapboxMap(id, payload), 0);

  return (
    `<div class="artifact">` +
      header +
      `<div class="map-wrap"><div id="${id}" class="midge-map"></div></div>` +
      overlayBar +
    `</div>` +
    condHtml
  );
}

async function mountMapboxMap(domId, payload) {
  const el = document.getElementById(domId);
  if (!el) return;

  if (typeof mapboxgl === "undefined") {
    el.outerHTML = `<div class="map-error">Mapbox couldn't load. Check your network and try again.</div>`;
    return;
  }

  // Token: prefer the scoped one minted by the subagent. If absent (no
  // MAPBOX_SECRET_TOKEN on Railway yet), try fetching from the backend's
  // /mapbox-token endpoint. If that also fails, show a graceful error.
  let token = payload.scoped_token;
  if (!token) {
    try {
      const tokenUrl = API.replace(/\/ask$/, "/mapbox-token");
      const r = await fetch(tokenUrl);
      if (r.ok) {
        const j = await r.json();
        token = j.token;
      }
    } catch (_) {
      // fall through to error below
    }
  }
  if (!token) {
    el.outerHTML = `<div class="map-error">Map unavailable — MAPBOX_SECRET_TOKEN isn't configured on the server yet.</div>`;
    return;
  }

  mapboxgl.accessToken = token;
  const config = payload.config || {};
  const center = config.center || {};
  const map = new mapboxgl.Map({
    container: domId,
    style: config.style_url || "mapbox://styles/mapbox/outdoors-v12",
    center: [center.lon || 0, center.lat || 0],
    zoom: config.zoom || 11,
  });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");

  // Markers
  const markers = config.markers || [];
  markers.forEach(m => {
    if (typeof m.lat !== "number" || typeof m.lon !== "number") return;
    const popupHtml = m.popup
      ? `<div style="font-size:12px;line-height:1.5">` +
        `<strong>${escapeHtml(m.label || "")}</strong><br>` +
        escapeHtml(m.popup).replace(/\n/g, "<br>") +
        `</div>`
      : `<div style="font-size:12px"><strong>${escapeHtml(m.label || "")}</strong></div>`;
    new mapboxgl.Marker({ color: "#e24b4a" })
      .setLngLat([m.lon, m.lat])
      .setPopup(new mapboxgl.Popup({ offset: 18 }).setHTML(popupHtml))
      .addTo(map);
  });

  // Fit to bbox if available
  const bbox = config.bbox;
  if (bbox && typeof bbox.west === "number") {
    map.fitBounds(
      [[bbox.west, bbox.south], [bbox.east, bbox.north]],
      { padding: 36, duration: 0, maxZoom: 14 }
    );
  }

  // Wire overlay toggle buttons. v1: visual-only — flipping a toggle
  // marks it active. Actual layer rendering wires in here later when the
  // overlay tile sources are decided. The frontend contract is locked in
  // now so the rebuild can extend without changing the API.
  document.querySelectorAll(`.map-overlay-toggle[data-map-id="${domId}"]`).forEach(btn => {
    btn.addEventListener("click", () => {
      btn.classList.toggle("on");
      // TODO(rebuild): toggle map.setLayoutProperty(...) for each overlay
    });
  });
}

function renderArtifact(art) {
  if (!art || !art.type) return "";
  if (art.type === "map") return renderMapArtifact(art.data || {});
  if (art.type === "conditions") return renderConditionsCard(art.data || {});
  return "";
}
function addMsg(role, html, pending) {
  const div = document.createElement("div");
  div.className = "msg " + role + (pending ? " pending" : "");
  div.innerHTML = html;
  log.appendChild(div);
  canvas.scrollTop = canvas.scrollHeight;
  return div;
}
function showLog() {
  welcome.classList.add("hidden");
  log.classList.remove("hidden");
}

async function ask(question) {
  showLog();
  addMsg("user", render(question));
  const pending = addMsg("midge", "MIDGE is thinking…", true);
  send.disabled = true;
  try {
    const resp = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history, session_id: SESSION_ID })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const answer = data.answer || "(no answer returned)";
    pending.classList.remove("pending");

    // Compose the bubble: model's narration first, then any visual
    // artifacts (map or conditions card) the tool-calling loop produced.
    // The text leads — the visuals support it, never replace it.
    let html = render(answer);
    const artifacts = Array.isArray(data.artifacts) ? data.artifacts : [];
    for (const art of artifacts) {
      const block = renderArtifact(art);
      if (block) html += block;
    }
    pending.innerHTML = html;

    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: answer });
  } catch (e) {
    pending.classList.remove("pending");
    pending.innerHTML = `<span class="err">MIDGE is unreachable right now — try again in a moment. (${e.message})</span>`;
  } finally {
    send.disabled = false;
    q.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  q.style.height = "auto";
  ask(text);
});
q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 140) + "px";
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event("submit"));
  }
});

// Chip suggestions
document.getElementById("chips").addEventListener("click", e => {
  const btn = e.target.closest(".chip"); if (!btn) return;
  ask(btn.dataset.q);
});

// ── Boot ────────────────────────────────────────────────────
applyPrefs();
q.focus();
</script>

</body>
</html>
