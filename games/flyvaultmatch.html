<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyVault Match</title>
<style>
  :root{
    --ink:#0d0f0e; --paper:#f3efe6; --line:#c9c1b0;
    --accent:#6b8f71; --accent-deep:#3f5c46; --gold:#b8924a;
    --shadow:rgba(13,15,14,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Georgia','Times New Roman',serif;
    background:radial-gradient(120% 80% at 50% -10%, #1a221c 0%, #0d0f0e 62%) fixed;
    color:var(--paper); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:18px 14px 40px;
  }
  .masthead{text-align:center;margin-bottom:14px}
  .brandmark{display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:6px}
  .brandmark img{width:46px; height:46px; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .brandmark .wm{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; letter-spacing:.46em;
    text-transform:uppercase; color:var(--paper); padding-left:.46em}
  .brandmark .wm b{color:var(--gold); font-weight:700}
  .masthead .eyebrow{font-size:11px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--accent); font-family:'Helvetica Neue',Arial,sans-serif; margin-bottom:6px}
  .masthead h1{font-size:clamp(26px,6vw,40px); font-weight:400; letter-spacing:.02em; line-height:1}
  .masthead h1 em{font-style:italic; color:var(--gold)}
  .masthead .rules{margin-top:8px; font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#9aa39a}

  .panel{width:100%; max-width:520px}
  .statusbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; letter-spacing:.1em}
  .statusbar .stat .n{color:var(--gold); font-size:18px}
  .statusbar .stat .l{color:#9aa39a; font-size:9px; letter-spacing:.28em; text-transform:uppercase}
  .statusbar .stat{text-align:center}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; perspective:900px}
  .card{
    position:relative; aspect-ratio:3/4; cursor:pointer;
    transform-style:preserve-3d; transition:transform .42s cubic-bezier(.4,.6,.2,1);
  }
  .card.flipped, .card.matched{transform:rotateY(180deg)}
  .card:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:10px}
  .face{
    position:absolute; inset:0; border-radius:10px; backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 4px 10px var(--shadow);
  }
  /* ---- CARD BACK (shown when face-down) ---- */
  .back{
    background:linear-gradient(160deg,#16201a,#0d0f0e);
    border:1px solid rgba(184,146,74,.35);
  }
  .back img{width:64%; height:64%; object-fit:contain; opacity:.9}
  .back::after{content:""; position:absolute; inset:5px; border:1px solid rgba(184,146,74,.2); border-radius:7px}

  /* ---- CARD FRONT (the fly) — THIS is the swappable template slot ---- */
  .front{
    transform:rotateY(180deg);
    background:#fbf9f3; color:#13110d; border:1px solid #ddd5c4;
    flex-direction:column; gap:6px; padding:8px; text-align:center;
  }
  .front .fly-emblem{
    width:54%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, var(--accent), var(--accent-deep));
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.2), inset 0 -3px 6px rgba(0,0,0,.3);
  }
  .front .fly-emblem span{font-size:140%; color:#f3efe6}
  .front .fly-name{font-family:'Georgia',serif; font-size:clamp(10px,3.2vw,14px); line-height:1.1; font-weight:600}
  .front .fly-cat{font-family:'Helvetica Neue',Arial,sans-serif; font-size:8px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent-deep)}
  .card.matched .front{box-shadow:0 0 0 2px var(--gold), 0 4px 10px var(--shadow); animation:pop .4s ease}
  @keyframes pop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.06)}100%{transform:rotateY(180deg) scale(1)}}

  .controls{display:flex; gap:10px; justify-content:center; margin-top:18px}
  button.action{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; letter-spacing:.18em;
    text-transform:uppercase; background:transparent; color:var(--paper);
    border:1px solid rgba(201,193,176,.45); border-radius:999px; padding:12px 26px; cursor:pointer; transition:all .15s ease}
  button.action:hover{background:var(--accent); border-color:var(--accent); color:#0d0f0e}
  button.action.primary{background:var(--gold); border-color:var(--gold); color:#0d0f0e}
  button.action:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  .banner{position:fixed; inset:0; background:rgba(8,10,9,.86); display:none; align-items:center; justify-content:center; z-index:50; padding:24px}
  .banner.show{display:flex}
  .banner-card{background:var(--paper); color:#13110d; border-radius:16px; padding:34px 30px; text-align:center; max-width:340px; box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .banner-card .eyebrow{font-family:'Helvetica Neue',Arial,sans-serif; font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--accent-deep)}
  .banner-card h2{font-size:28px; font-weight:400; margin:8px 0 4px}
  .banner-card p{font-size:15px; color:#4a463c; margin-bottom:20px}
  @media (prefers-reduced-motion:reduce){.card{transition:none}.card.matched .front{animation:none}}
</style>
</head>

// ---- THE FLY DECK ----------------------------------------------------------
// Placeholder patterns. Later: swap this array for live Supabase vault rows,
// and swap the .front markup in cardFront() for your real HTML card template.
const FLIES = [
  {name:"Adams",            cat:"Dry",    glyph:"\u27A4"},
  {name:"Elk Hair Caddis",  cat:"Dry",    glyph:"\u2766"},
  {name:"Pheasant Tail",    cat:"Nymph",  glyph:"\u279C"},
  {name:"Woolly Bugger",    cat:"Streamer",glyph:"\u2748"},
  {name:"Hare\u2019s Ear",  cat:"Nymph",  glyph:"\u2756"},
  {name:"Royal Wulff",      cat:"Dry",    glyph:"\u2737"},
  {name:"Zebra Midge",      cat:"Midge",  glyph:"\u25CF"},
  {name:"Clouser Minnow",   cat:"Streamer",glyph:"\u25C8"},
  {name:"Parachute Adams",  cat:"Dry",    glyph:"\u2735"},
  {name:"Copper John",      cat:"Nymph",  glyph:"\u29BF"},
  {name:"Griffith\u2019s Gnat",cat:"Midge",glyph:"\u2742"},
  {name:"San Juan Worm",    cat:"Nymph",  glyph:"\u219D"}
];
const PAIRS = 8;

let cards=[], flipped=[], matchedCount=0, moves=0, lock=false;
let startTime=null, timerInt=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function cardFront(fly){
  // <<< SWAP THIS BLOCK for your real HTML card template later >>>
  return '<div class="face front">'
    +'<div class="fly-emblem"><span>'+fly.glyph+'</span></div>'
    +'<div class="fly-name">'+fly.name+'</div>'
    +'<div class="fly-cat">'+fly.cat+'</div>'
    +'</div>';
}
function cardBack(){
  return '<div class="face back"><img src="'+BACK+'" alt=""></div>';
}

function build(){
  // pick 8 distinct flies, duplicate into pairs, shuffle
  const pick=shuffle(FLIES.slice()).slice(0,PAIRS);
  let deck=[];
  pick.forEach((f,i)=>{ deck.push({id:i,fly:f}); deck.push({id:i,fly:f}); });
  deck=shuffle(deck);
  cards=deck;
  flipped=[]; matchedCount=0; moves=0; lock=false;
  startTime=null; clearInterval(timerInt); timerInt=null;
  document.getElementById("timer").textContent="0:00";
  document.getElementById("moves").textContent="0";
  document.getElementById("matched").textContent="0";
  document.getElementById("banner").classList.remove("show");
  render();
}

function render(){
  const g=document.getElementById("grid"); g.innerHTML="";
  cards.forEach((c,idx)=>{
    const el=document.createElement("div");
    el.className="card"+(c.flippedState?" flipped":"")+(c.matched?" matched":"");
    el.setAttribute("role","button"); el.setAttribute("tabindex","0");
    el.setAttribute("aria-label", c.matched||c.flippedState ? c.fly.name : "Face-down card");
    el.innerHTML=cardBack()+cardFront(c.fly);
    el.onclick=()=>flip(idx);
    el.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();flip(idx);} };
    g.appendChild(el);
  });
}

function startTimer(){
  if(timerInt)return;
  startTime=Date.now();
  timerInt=setInterval(()=>{
    const s=Math.floor((Date.now()-startTime)/1000);
    const m=Math.floor(s/60), ss=String(s%60).padStart(2,"0");
    document.getElementById("timer").textContent=m+":"+ss;
  },500);
}

function flip(idx){
  if(lock)return;
  const c=cards[idx];
  if(c.matched||c.flippedState)return;
  if(flipped.length>=2)return;
  startTimer();
  c.flippedState=true; flipped.push(idx); render();
  if(flipped.length===2){
    moves++; document.getElementById("moves").textContent=moves;
    const [a,b]=flipped;
    if(cards[a].id===cards[b].id){
      cards[a].matched=true; cards[b].matched=true;
      matchedCount++; document.getElementById("matched").textContent=matchedCount;
      flipped=[];
      render();
      if(matchedCount===PAIRS) finish();
    }else{
      lock=true;
      setTimeout(()=>{
        cards[a].flippedState=false; cards[b].flippedState=false;
        flipped=[]; lock=false; render();
      },820);
    }
  }
}

function finish(){
  clearInterval(timerInt); timerInt=null;
  const s=Math.floor((Date.now()-startTime)/1000);
  const m=Math.floor(s/60), ss=String(s%60).padStart(2,"0");
  let grade="Solid run.";
  if(moves<=10) grade="Photographic. ";
  else if(moves<=14) grade="Sharp eye.";
  else if(moves<=20) grade="Nicely done.";
  document.getElementById("bnTitle").textContent=grade;
  document.getElementById("bnText").innerHTML="Cleared in "+moves+" moves &middot; "+m+":"+ss+".";
  setTimeout(()=>document.getElementById("banner").classList.add("show"), 500);
}

document.getElementById("newGame").onclick=build;
document.getElementById("bnAgain").onclick=build;
build();
</script>
