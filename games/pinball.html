<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>River Run Pinball</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:radial-gradient(circle at 50% 0%, #14323f 0%, #08161f 70%);
    font-family:"Georgia",serif;color:#e7f2ef;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none;}
  .frame{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;}
  .head{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:380px;padding:0 4px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand img{width:30px;height:auto;opacity:.92;}
  .wordmark{line-height:1;}
  .wordmark .fv{font-family:"Helvetica Neue",sans-serif;font-weight:700;letter-spacing:3px;font-size:15px;color:#e7f2ef;}
  .wordmark .fv b{color:#c98a3f;font-weight:700;}
  .wordmark small{display:block;font-size:9px;letter-spacing:3px;color:#5f8a4a;text-transform:uppercase;font-family:"Helvetica Neue",sans-serif;margin-top:3px;}
  .readout{text-align:right;font-family:"Helvetica Neue",sans-serif;}
  .score{font-size:24px;font-weight:700;color:#e7f2ef;line-height:1;}
  .balls{font-size:10px;letter-spacing:2px;color:#5f8a4a;text-transform:uppercase;}
  canvas{background:linear-gradient(180deg,#0d2733 0%,#0a1c26 55%,#081820 100%);
    border:3px solid #2a4a55;border-radius:18px 18px 10px 10px;
    box-shadow:0 0 0 4px #0a1620,0 18px 40px rgba(0,0,0,.6),inset 0 0 60px rgba(0,0,0,.4);touch-action:none;}
  .controls{display:flex;width:100%;max-width:380px;gap:10px;}
  .flip{flex:1;padding:18px 0;background:linear-gradient(180deg,#1a4250,#0e2a34);
    border:2px solid #2f5562;border-radius:12px;color:#e7f2ef;font-family:"Helvetica Neue",sans-serif;
    font-size:13px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:transform .05s,background .1s;}
  .flip:active{transform:translateY(2px);background:linear-gradient(180deg,#246072,#163b47);}
  .launch{background:linear-gradient(180deg,#b5652f,#7d3f17);border-color:#c9863f;flex:0 0 90px;}
  .launch:active{background:linear-gradient(180deg,#d4762f,#8d4a17);}
  .msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(8,22,30,.94);
    border:2px solid #c98a3f;border-radius:14px;padding:26px 30px;text-align:center;max-width:300px;display:none;z-index:5;}
  .msg h2{font-size:22px;color:#c98a3f;margin-bottom:8px;}
  .msg p{font-size:13px;line-height:1.5;color:#e7f2ef;font-family:"Helvetica Neue",sans-serif;margin-bottom:16px;}
  .msg button{background:#c98a3f;color:#0a1620;border:none;border-radius:8px;padding:12px 26px;
    font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:"Helvetica Neue",sans-serif;}
  .hint{font-size:10px;color:#5f8a4a;letter-spacing:2px;text-transform:uppercase;font-family:"Helvetica Neue",sans-serif;margin-top:2px;}
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <div class="brand">
      <img id="brandLogo" alt="">
      <div class="wordmark"><span class="fv">FLY<b>VAULT</b></span><small>River Run Pinball</small></div>
    </div>
    <div class="readout"><div class="score" id="score">0</div><div class="balls" id="balls">●●●</div></div>
  </div>
  <div style="position:relative;">
    <canvas id="board" width="360" height="600"></canvas>
    <div class="msg" id="msg">
      <h2 id="msgTitle">River Run</h2>
      <p id="msgBody">Hold LAUNCH to load the cast, release to fire the fly up the rail. Tap the flippers to keep it in play. Three casts.</p>
      <button id="msgBtn">Start</button>
    </div>
  </div>
  <div class="controls">
    <button class="flip" id="leftBtn">◄ Left</button>
    <button class="flip launch" id="launchBtn">Launch</button>
    <button class="flip" id="rightBtn">Right ►</button>
  </div>
  <div class="hint">← / →  flippers · Space launch</div>
</div>

const logoImg=new Image();let logoReady=false;
logoImg.onload=()=>logoReady=true;logoImg.src=LOGO_SRC;
document.getElementById('brandLogo').src=LOGO_SRC;

const cv=document.getElementById('board'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const scoreEl=document.getElementById('score'),ballsEl=document.getElementById('balls');
const msg=document.getElementById('msg'),msgTitle=document.getElementById('msgTitle'),
      msgBody=document.getElementById('msgBody'),msgBtn=document.getElementById('msgBtn');

const GRAV=0.24,FRICTION=0.997,MAXSPEED=15;
let score=0,ballsLeft=3,running=false;
let ballState='ready',plungerPower=0,plungerCharging=false;

// plunger lane (right) — single clean rail, no crossover
const LANE_W=22, LANE_X=W-LANE_W/2-6, LANE_LEFT=W-LANE_W-6;
const LANE_TOP=150;
const ball={x:0,y:0,vx:0,vy:0,r:8};

const bumpers=[
  {x:104,y:150,r:26,pts:100,kind:'fish',flash:0},
  {x:226,y:150,r:26,pts:100,kind:'fish',flash:0},
  {x:165,y:248,r:40,pts:500,kind:'logo',flash:0},
  {x:70,y:330,r:20,pts:150,kind:'reed',flash:0},
  {x:260,y:330,r:20,pts:150,kind:'reed',flash:0},
];
const slings=[
  {x1:28,y1:410,x2:86,y2:498,pts:25},
  {x1:296,y1:410,x2:244,y2:498,pts:25},
];

// flippers — pivots computed for a 24px (1.5x ball) tip gap, tips meeting near center
const flipperLen=72;
const flippers={
  left:{px:98,py:525,rest:0.45,up:-0.60,ang:0.45,on:false},
  right:{px:262,py:525,rest:Math.PI-0.45,up:Math.PI+0.74,ang:Math.PI-0.45,on:false},
};
function tip(f){return{x:f.px+Math.cos(f.ang)*flipperLen,y:f.py+Math.sin(f.ang)*flipperLen};}

function loadBall(){ball.x=LANE_X;ball.y=H-90;ball.vx=0;ball.vy=0;ballState='ready';plungerPower=0;}
function startGame(){score=0;ballsLeft=3;updateHud();msg.style.display='none';running=true;loadBall();}
function updateHud(){scoreEl.textContent=score.toLocaleString();
  ballsEl.textContent='●'.repeat(Math.max(0,ballsLeft))+'○'.repeat(Math.max(0,3-ballsLeft));}
function showMsg(t,b,btn){msgTitle.textContent=t;msgBody.textContent=b;msgBtn.textContent=btn;msg.style.display='block';}
function ballLost(){ballsLeft--;updateHud();
  if(ballsLeft<=0){running=false;showMsg('Lines In','Final score: '+score.toLocaleString()+'. The river always wins eventually.','Cast Again');}
  else{ballState='lost';setTimeout(()=>{if(running)loadBall();},500);}}

function reflect(nx,ny,boost){const dot=ball.vx*nx+ball.vy*ny;
  ball.vx=(ball.vx-2*dot*nx)*0.86;ball.vy=(ball.vy-2*dot*ny)*0.86;
  if(boost){ball.vx+=nx*boost;ball.vy+=ny*boost;}}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
  const cx=x1+t*dx,cy=y1+t*dy;return{d:Math.hypot(px-cx,py-cy),cx,cy};}

function update(){
  // flippers always animate so taps respond even before launch / between balls
  animateFlipper(flippers.left);animateFlipper(flippers.right);

  if(!running){return;}
  if(ballState==='ready'){
    if(plungerCharging)plungerPower=Math.min(plungerPower+0.45,24);
    ball.y=H-90+plungerPower*0.5;return;
  }
  if(ballState==='lost')return;
  ball.vy+=GRAV;ball.vx*=FRICTION;
  const sp=Math.hypot(ball.vx,ball.vy);if(sp>MAXSPEED){ball.vx*=MAXSPEED/sp;ball.vy*=MAXSPEED/sp;}
  ball.x+=ball.vx;ball.y+=ball.vy;

  if(ballState==='launching'){
    if(ball.x-ball.r<LANE_LEFT){ball.x=LANE_LEFT+ball.r;ball.vx=Math.abs(ball.vx)*0.4;}
    if(ball.x+ball.r>W-6){ball.x=W-6-ball.r;ball.vx=-Math.abs(ball.vx)*0.6;}
    if(ball.y<LANE_TOP){ballState='play';ball.vx=-3.4;}
    if(ball.y-ball.r<8){ball.y=8+ball.r;ball.vy=Math.abs(ball.vy)*0.6;ballState='play';ball.vx=-3.4;}
  }
  if(ballState==='play'){
    if(ball.x-ball.r<8){ball.x=8+ball.r;ball.vx=Math.abs(ball.vx)*0.86;}
    if(ball.x+ball.r>W-8){ball.x=W-8-ball.r;ball.vx=-Math.abs(ball.vx)*0.86;}
    if(ball.y-ball.r<8){ball.y=8+ball.r;ball.vy=Math.abs(ball.vy)*0.86;}
    for(const b of bumpers){const d=Math.hypot(ball.x-b.x,ball.y-b.y);
      if(d<b.r+ball.r){const nx=(ball.x-b.x)/d,ny=(ball.y-b.y)/d;
        ball.x=b.x+nx*(b.r+ball.r);ball.y=b.y+ny*(b.r+ball.r);
        reflect(nx,ny,3.4);b.flash=8;score+=b.pts;updateHud();}}
    for(const s of slings){const r=segDist(ball.x,ball.y,s.x1,s.y1,s.x2,s.y2);
      if(r.d<ball.r+4){let nx=ball.x-r.cx,ny=ball.y-r.cy;const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
        ball.x=r.cx+nx*(ball.r+4);ball.y=r.cy+ny*(ball.r+4);reflect(nx,ny,4);score+=s.pts;updateHud();}}
    collideFlipper(flippers.left);collideFlipper(flippers.right);
    // outlane funnel walls toward center drain (left wall + right wall, neither touches plunger lane)
    const wl=segDist(ball.x,ball.y,30,432,flippers.left.px-4,flippers.left.py-2);
    if(wl.d<ball.r+2){let nx=ball.x-wl.cx,ny=ball.y-wl.cy;const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
      ball.x=wl.cx+nx*(ball.r+2);ball.y=wl.cy+ny*(ball.r+2);reflect(nx,ny,0);}
    const wr=segDist(ball.x,ball.y,LANE_LEFT-2,432,flippers.right.px+4,flippers.right.py-2);
    if(wr.d<ball.r+2){let nx=ball.x-wr.cx,ny=ball.y-wr.cy;const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
      ball.x=wr.cx+nx*(ball.r+2);ball.y=wr.cy+ny*(ball.r+2);reflect(nx,ny,0);}
  }
  if(ball.y-ball.r>H){ballLost();}
}

function animateFlipper(f){
  // always runs every frame so flippers respond to taps regardless of ball state
  const target=f.on?f.up:f.rest;
  f.lastAng=f.ang;
  f.ang+=(target-f.ang)*0.6;
}
function collideFlipper(f){
  const swing=Math.abs(f.ang-(f.lastAng??f.ang));
  const t=tip(f);const r=segDist(ball.x,ball.y,f.px,f.py,t.x,t.y);
  if(r.d<ball.r+7){
    let nx=ball.x-r.cx,ny=ball.y-r.cy;const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
    if(ny>-0.15) ny=-0.15;
    const rm=Math.hypot(nx,ny)||1;nx/=rm;ny/=rm;
    ball.x=r.cx+nx*(ball.r+7);ball.y=r.cy+ny*(ball.r+7);
    const dot=ball.vx*nx+ball.vy*ny;
    ball.vx=(ball.vx-2*dot*nx)*0.86;
    ball.vy=(ball.vy-2*dot*ny)*0.86;
    if(f.on){
      const kick=7+swing*60;
      ball.vx+=nx*kick*0.5;
      ball.vy-=Math.abs(kick);
      if(ball.vy>-7)ball.vy=-7-swing*40;
    }else{
      if(ball.vy>0)ball.vy=-Math.max(2.2,ball.vy*0.5);
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,180,190,.06)';ctx.lineWidth=2;
  for(let i=0;i<7;i++){const y=70+i*72+Math.sin(Date.now()/900+i)*6;
    ctx.beginPath();ctx.moveTo(20,y);ctx.bezierCurveTo(120,y-14,240,y+14,W-20,y);ctx.stroke();}

  // plunger lane — single clean rail with a top curve into the field
  ctx.strokeStyle='#2a4a55';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(LANE_LEFT,H-12);ctx.lineTo(LANE_LEFT,LANE_TOP+6);
  ctx.quadraticCurveTo(LANE_LEFT,LANE_TOP-30,LANE_LEFT-44,LANE_TOP-36);ctx.stroke();

  // outlane funnel walls (do NOT cross the plunger lane)
  ctx.strokeStyle='#2a4a55';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(30,432);ctx.lineTo(flippers.left.px-4,flippers.left.py-2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(LANE_LEFT-2,432);ctx.lineTo(flippers.right.px+4,flippers.right.py-2);ctx.stroke();

  ctx.strokeStyle='#3a6b52';ctx.lineWidth=8;ctx.lineCap='round';
  for(const s of slings){ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();}
  ctx.lineCap='butt';

  for(const b of bumpers){
    if(b.kind==='logo'){
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fillStyle=b.flash>0?'rgba(201,138,63,.35)':'rgba(20,50,63,.6)';ctx.fill();
      ctx.lineWidth=3;ctx.strokeStyle=b.flash>0?'#fff':'#c98a3f';ctx.stroke();
      if(logoReady){const w=b.r*1.7,h=w*(logoImg.height/logoImg.width);
        ctx.drawImage(logoImg,b.x-w/2,b.y-h/2,w,h);}
    }else{
      ctx.beginPath();ctx.fillStyle=b.flash>0?'#c98a3f':'#163b47';
      ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.lineWidth=3;ctx.strokeStyle=b.flash>0?'#fff':'#2f6b78';ctx.stroke();
      ctx.font=b.r+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.kind==='fish'?'\u{1F41F}':'\u{1F33F}',b.x,b.y+2);}
    if(b.flash>0)b.flash--;
  }

  drawFlipper(flippers.left);drawFlipper(flippers.right);

  // ball
  ctx.beginPath();ctx.fillStyle='#e7f2ef';ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#b5652f';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='rgba(181,101,47,.6)';ctx.beginPath();
  ctx.moveTo(ball.x-ball.r,ball.y);ctx.lineTo(ball.x+ball.r,ball.y);ctx.stroke();

  if(ballState==='ready'&&plungerPower>0){
    ctx.fillStyle='#c98a3f';ctx.fillRect(LANE_LEFT+4,H-18,LANE_W-8,-plungerPower*4);}
  if(ballState==='ready'){
    ctx.fillStyle='rgba(201,138,63,.85)';ctx.font='11px "Helvetica Neue",sans-serif';
    ctx.textAlign='center';ctx.fillText('▲ HOLD LAUNCH',LANE_X,H-110);
  }
}
function drawFlipper(f){const t=tip(f);
  ctx.strokeStyle='#cba35c';ctx.lineWidth=14;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(f.px,f.py);ctx.lineTo(t.x,t.y);ctx.stroke();
  ctx.fillStyle='#0a1620';ctx.beginPath();ctx.arc(f.px,f.py,5,0,Math.PI*2);ctx.fill();ctx.lineCap='butt';}

function loop(){update();draw();requestAnimationFrame(loop);}

function flip(side,on){if(side==='left')flippers.left.on=on;if(side==='right')flippers.right.on=on;}
function launchStart(){if(ballState==='ready')plungerCharging=true;}
function launchEnd(){if(ballState==='ready'&&plungerCharging){plungerCharging=false;
  ball.vy=-(6.5+plungerPower*0.85);ball.vx=0;ballState='launching';plungerPower=0;}}
function bind(el,d,u){
  el.addEventListener('mousedown',e=>{e.preventDefault();d();});
  el.addEventListener('mouseup',e=>{e.preventDefault();u();});
  el.addEventListener('mouseleave',()=>u());
  el.addEventListener('touchstart',e=>{e.preventDefault();d();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();u();},{passive:false});}
bind(document.getElementById('leftBtn'),()=>flip('left',true),()=>flip('left',false));
bind(document.getElementById('rightBtn'),()=>flip('right',true),()=>flip('right',false));
bind(document.getElementById('launchBtn'),launchStart,launchEnd);
document.addEventListener('keydown',e=>{if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key==='a')flip('left',true);
  if(e.key==='ArrowRight'||e.key==='l')flip('right',true);
  if(e.key===' '){e.preventDefault();launchStart();}});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')flip('left',false);
  if(e.key==='ArrowRight'||e.key==='l')flip('right',false);
  if(e.key===' ')launchEnd();});
msgBtn.addEventListener('click',startGame);
// start live immediately so flippers + launch respond without a tap-to-start gate
running=true;score=0;ballsLeft=3;
loadBall();
updateHud();loop();
</script>
