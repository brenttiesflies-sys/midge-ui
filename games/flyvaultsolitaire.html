<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlyVault Solitaire</title>
<style>
  :root{
    --green-top:#2f4a3e;
    --green-bot:#16241d;
    --cream:#ece6d4;
    --cream-card:#f3eee0;
    --orange:#cf7a3f;
    --orange-glow:rgba(207,122,63,.45);
    --ink:#1c2a22;
    --red:#9a2f2a;
    --muted:#8a9a8e;
    --line:rgba(255,255,255,.10);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--serif);
    background:linear-gradient(180deg,var(--green-top) 0%,var(--green-bot) 70%);
    background-attachment:fixed;
    color:var(--cream);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:720px;margin:0 auto;padding:14px 12px 40px;}

  /* header */
  .top{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 2px 14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo-mark{height:30px;flex:none;}
  .wordmark{font-weight:700;letter-spacing:.14em;font-size:21px;}
  .wordmark .v{color:var(--orange);}
  .wordmark .g{color:var(--cream);}
  .score{text-align:right;color:var(--muted);letter-spacing:.12em;font-size:14px;line-height:1.5;}
  .score b{color:var(--cream);font-weight:700;}

  /* foundations + stock row */
  .toprow{display:flex;justify-content:space-between;gap:6px;margin-bottom:14px;}
  .stockzone,.foundzone{display:flex;gap:6px;}
  .slot{
    width:var(--cw);height:var(--ch);border-radius:9px;
    border:1.5px dashed rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.16);font-size:22px;
    flex:none;position:relative;
  }
  .slot.suit-slot{font-size:26px;}

  /* tableau */
  .tableau{display:flex;justify-content:space-between;gap:6px;}
  .col{flex:1;min-width:0;position:relative;}
  .colslot{
    width:100%;aspect-ratio:5/7;border-radius:9px;
    border:1.5px dashed rgba(255,255,255,.12);
  }

  /* card */
  .card{
    width:var(--cw);height:var(--ch);border-radius:9px;
    position:absolute;left:0;
    background:var(--cream-card);
    box-shadow:0 2px 5px rgba(0,0,0,.35);
    cursor:pointer;user-select:none;
    transition:transform .07s ease;
    overflow:hidden;
  }
  .card.intab{width:100%;height:auto;aspect-ratio:5/7;}
  .card .corner{
    position:absolute;top:5px;left:7px;
    font-weight:700;line-height:1;
    display:flex;flex-direction:column;align-items:center;gap:1px;
  }
  .card .rank{font-size:clamp(13px,4.4vw,19px);}
  .card .suit{font-size:clamp(11px,3.6vw,15px);}
  .card .pip{
    position:absolute;bottom:6px;right:8px;
    font-size:clamp(15px,5vw,22px);line-height:1;opacity:.9;
  }
  .card.red{color:var(--red);}
  .card.black{color:var(--ink);}
  .card.face-down{
    background:#0f1611;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 2px 5px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .card.face-down .cardfly{width:78%;opacity:.92;}
  .logo-mark{height:30px;display:block;}
  .logo-win{width:100px;opacity:.9;}
  .card.sel{outline:2.5px solid var(--orange);outline-offset:-1px;box-shadow:0 0 12px var(--orange-glow),0 2px 5px rgba(0,0,0,.35);}
  .card.hintable{outline:2px solid rgba(207,122,63,.55);outline-offset:-1px;}
  .card:active{transform:scale(.985);}

  /* controls */
  .controls{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .status{font-size:18px;text-align:center;min-height:24px;}
  .status .hl{color:var(--orange);font-weight:700;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn{
    font-family:var(--serif);font-size:17px;font-weight:700;
    color:#22150c;background:var(--orange);
    border:none;border-radius:11px;padding:13px 26px;
    box-shadow:0 0 16px var(--orange-glow);cursor:pointer;
    transition:filter .12s ease,transform .07s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{
    background:transparent;color:var(--orange);
    box-shadow:none;border:1px solid rgba(207,122,63,.4);
    font-size:15px;padding:11px 20px;
  }
  .helper{color:var(--muted);font-style:italic;font-size:15px;text-align:center;max-width:380px;line-height:1.5;}

  /* win overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(11,18,14,.86);
    display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:18px;text-align:center;padding:30px;z-index:40;
  }
  .overlay.show{display:flex;}
  .overlay h2{font-size:30px;margin:0;letter-spacing:.04em;}
  .overlay svg{width:90px;height:64px;opacity:.85;}
  .overlay p{color:var(--muted);font-style:italic;margin:0;font-size:17px;}

  @media (max-width:520px){
    .wrap{--cw:46px;--ch:64px;}
    .wordmark{font-size:18px;}
    .brand svg{width:36px;height:26px;}
  }
  @media (min-width:521px){
    .wrap{--cw:64px;--ch:90px;}
  }
</style>
</head>

  let stock=[],waste=[],found=[[],[],[],[]],tab=[[],[],[],[],[],[],[]];
  let sel=null,moves=0,startTime=null,timerInt=null;

  const $=id=>document.getElementById(id);

  function makeDeck(){
    let d=[];
    for(let si=0;si<4;si++)for(let r=0;r<13;r++)
      d.push({suit:SUITS[si],rank:r,faceUp:false});
    for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
    return d;
  }
  function newGame(){
    const d=makeDeck();
    tab=[[],[],[],[],[],[],[]];found=[[],[],[],[]];waste=[];
    for(let c=0;c<7;c++)for(let r=0;r<=c;r++){
      const card=d.pop();card.faceUp=(r===c);tab[c].push(card);
    }
    stock=d;sel=null;moves=0;
    $('overlay').classList.remove('show');
    startTime=Date.now();
    clearInterval(timerInt);
    timerInt=setInterval(updTimer,1000);
    updTimer();render();setStatus('Tap <span class="hl">stock</span> to draw.');
  }
  function updTimer(){
    if(!startTime)return;
    const s=Math.floor((Date.now()-startTime)/1000);
    $('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  }
  function setStatus(html){$('status').innerHTML=html;}
  function bump(){moves++;$('moves').textContent=moves;}

  function cardEl(card,inTab){
    const el=document.createElement('div');
    el.className='card '+(inTab?'intab ':'');
    if(!card.faceUp){
      el.className+='face-down';el.innerHTML=flySVG;return el;
    }
    el.className+=card.suit.c;
    el.innerHTML='<div class="corner"><span class="rank">'+RANKS[card.rank]+
      '</span><span class="suit">'+card.suit.s+'</span></div>'+
      '<div class="pip">'+card.suit.s+'</div>';
    return el;
  }

  function render(){
    // stock
    const st=$('stock');st.innerHTML='';st.className='slot';
    if(stock.length){const e=document.createElement('div');e.className='card face-down';e.style.position='static';e.innerHTML=flySVG;st.appendChild(e);}
    else st.innerHTML='<span style="font-size:13px">\u21bb</span>';
    st.onclick=drawStock;

    // waste
    const ws=$('waste');ws.innerHTML='';ws.className='slot';
    if(waste.length){
      const top=waste[waste.length-1];top.faceUp=true;
      const e=cardEl(top,false);e.style.position='static';
      e.onclick=()=>pick({type:'waste'});
      if(sel&&sel.type==='waste')e.classList.add('sel');
      ws.appendChild(e);
    }

    // foundations
    const fz=$('foundations');fz.innerHTML='';
    for(let i=0;i<4;i++){
      const slot=document.createElement('div');slot.className='slot suit-slot';
      const pile=found[i];
      if(pile.length){const top=pile[pile.length-1];const e=cardEl(top,false);e.style.position='static';slot.appendChild(e);}
      else{slot.style.color='rgba(255,255,255,.14)';slot.textContent=SUITS[i].s;}
      slot.onclick=()=>foundationClick(i);
      fz.appendChild(slot);
    }

    // tableau
    const tz=$('tableau');tz.innerHTML='';
    const offset = window.innerWidth<521?20:26;
    for(let c=0;c<7;c++){
      const col=document.createElement('div');col.className='col';
      const slot=document.createElement('div');slot.className='colslot';col.appendChild(slot);
      let h=0;
      tab[c].forEach((card,ri)=>{
        const e=cardEl(card,true);
        e.style.top=h+'px';
        if(card.faceUp){
          e.onclick=(ev)=>{ev.stopPropagation();tableauClick(c,ri);};
          if(sel&&sel.type==='tab'&&sel.col===c&&sel.row<=ri)e.classList.add('sel');
        }
        col.appendChild(e);
        h+=(card.faceUp?offset:Math.round(offset*0.55));
      });
      slot.style.minHeight=(h+ (window.innerWidth<521?64:90))+'px';
      col.onclick=()=>{if(tab[c].length===0)tableauEmptyClick(c);};
      tz.appendChild(col);
    }
  }

  function drawStock(){
    if(stock.length){
      const card=stock.pop();card.faceUp=true;waste.push(card);
      sel=null;bump();render();
    }else if(waste.length){
      stock=waste.reverse().map(c=>(c.faceUp=false,c));waste=[];
      sel=null;render();setStatus('Stream reshuffled.');
    }
  }

  function topCard(){
    if(sel.type==='waste')return waste[waste.length-1];
    if(sel.type==='tab')return tab[sel.col][sel.row];
  }
  function pick(s){
    if(sel&&sel.type==='waste'&&s.type==='waste'){sel=null;render();return;}
    sel=s;render();
  }

  function canStack(moving,onto){ // tableau rule: down + alt color
    return moving.rank===onto.rank-1 && moving.suit.c!==onto.suit.c;
  }
  function canFound(card,pile){
    if(pile.length===0)return card.rank===0;
    const t=pile[pile.length-1];
    return card.suit.n===t.suit.n && card.rank===t.rank+1;
  }

  function tableauClick(c,ri){
    const card=tab[c][ri];
    if(!card.faceUp)return;
    if(!sel){
      // flip auto already; select run starting at ri (must be ordered run)
      sel={type:'tab',col:c,row:ri};render();return;
    }
    // attempt move selected onto this column's pile
    const moving=getMovingCards();
    const target=tab[c];
    if(sel.type==='tab'&&sel.col===c){sel={type:'tab',col:c,row:ri};render();return;}
    if(target.length && canStack(moving[0],target[target.length-1])){
      doMove(target);return;
    }
    // reselect
    sel={type:'tab',col:c,row:ri};render();
  }
  function tableauEmptyClick(c){
    if(!sel)return;
    const moving=getMovingCards();
    if(moving[0].rank===12){doMove(tab[c]);} // only K to empty
    else{sel=null;render();setStatus('Only a <span class="hl">King</span> moves to an empty column.');}
  }
  function getMovingCards(){
    if(sel.type==='waste')return [waste[waste.length-1]];
    return tab[sel.col].slice(sel.row);
  }
  function doMove(targetPile){
    const moving=getMovingCards();
    if(sel.type==='waste'){waste.pop();}
    else{tab[sel.col]=tab[sel.col].slice(0,sel.row);}
    moving.forEach(c=>targetPile.push(c));
    flipExposed();sel=null;bump();render();checkWin();
  }
  function flipExposed(){
    tab.forEach(col=>{if(col.length){const t=col[col.length-1];if(!t.faceUp)t.faceUp=true;}});
  }
  function foundationClick(i){
    if(!sel)return;
    const moving=getMovingCards();
    if(moving.length!==1){sel=null;render();return;}
    if(canFound(moving[0],found[i])){
      if(sel.type==='waste')waste.pop();else tab[sel.col].pop();
      found[i].push(moving[0]);flipExposed();sel=null;bump();render();checkWin();
    }else{sel=null;render();}
  }

  function autoToFoundation(card,from){
    for(let i=0;i<4;i++)if(canFound(card,found[i]))return i;
    return -1;
  }
  function autoFinish(){
    let did=true;
    function step(){
      did=false;
      // waste
      if(waste.length){const c=waste[waste.length-1];const f=autoToFoundation(c);if(f>=0){waste.pop();found[f].push(c);bump();did=true;}}
      for(let col=0;col<7&&!did;col++){
        if(tab[col].length){const c=tab[col][tab[col].length-1];if(c.faceUp){const f=autoToFoundation(c);if(f>=0){tab[col].pop();flipExposed();found[f].push(c);bump();did=true;}}}
      }
      render();
      if(did){checkWin();setTimeout(step,120);}
      else setStatus('No more cards can move up automatically.');
    }
    sel=null;step();
  }

  function showHint(){
    // 1 waste/tab -> foundation
    if(waste.length){const c=waste[waste.length-1];if(autoToFoundation(c)>=0){flash('waste');return;}}
    for(let col=0;col<7;col++){const p=tab[col];if(p.length){const c=p[p.length-1];if(c.faceUp&&autoToFoundation(c)>=0){flashTab(col,p.length-1);return;}}}
    // tableau -> tableau
    for(let from=0;from<7;from++){
      const p=tab[from];
      for(let ri=0;ri<p.length;ri++){
        if(!p[ri].faceUp)continue;
        const mv=p[ri];
        for(let to=0;to<7;to++){if(to===from)continue;const tp=tab[to];
          if(tp.length&&canStack(mv,tp[tp.length-1])){flashTab(from,ri);return;}
          if(tp.length===0&&mv.rank===12&&ri>0){flashTab(from,ri);return;}
        }
        break;
      }
    }
    setStatus(stock.length||waste.length?'Try drawing from the <span class="hl">stream</span>.':'No moves left \u2014 deal a new game.');
  }
  function flash(which){setStatus('Move the <span class="hl">'+which+'</span> card up to a foundation.');}
  function flashTab(col,ri){
    render();
    const cols=$('tableau').children[col];
    const cardEls=[...cols.querySelectorAll('.card')];
    if(cardEls[ri])cardEls[ri].classList.add('hintable');
    setStatus('Try the highlighted card.');
  }

  function checkWin(){
    if(found.reduce((a,p)=>a+p.length,0)===52){
      clearInterval(timerInt);
      $('wintext').textContent='Solved in '+moves+' moves, '+$('timer').textContent+'.';
      $('overlay').classList.add('show');
    }
  }

  $('newgame').onclick=newGame;
  $('playagain').onclick=newGame;
  $('hint').onclick=showHint;
  $('auto').onclick=autoFinish;
  window.addEventListener('resize',()=>render());
  newGame();
})();
</script>
