<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyVault — 4 in a Row</title>
<style>
  :root{
    --ink:#1c2b2d;--river:#2b6b6e;--river-deep:#194b4e;
    --paper:#f6f2e9;--paper-2:#efeadd;--paper-line:#d9d0bf;
    --muted:#8a8069;--gold:#c69a3f;--gold-deep:#a67f2c;--good:#3f7d5a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:radial-gradient(120% 90% at 50% -10%, #2f6b6e 0%, #1c4a4d 45%, #133638 100%);
    color:#eef0e8;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:16px 14px 30px;gap:13px;
  }
  header{text-align:center}
  .lockup{display:flex;align-items:center;justify-content:center;gap:12px}
  .lockup .logo{height:46px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .names{text-align:left;line-height:1}
  .brand-name{font-size:24px;font-weight:600;letter-spacing:.02em;text-shadow:0 1px 0 rgba(0,0,0,.25)}
  .sub{font-size:11px;letter-spacing:.34em;text-transform:uppercase;opacity:.72;margin-top:5px;font-family:ui-sans-serif,system-ui,sans-serif}
  .rule{width:60px;height:2px;margin:9px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  /* mode toggle */
  .modes{display:flex;gap:8px;font-family:ui-sans-serif,system-ui,sans-serif}
  .modes button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#eef0e8;
    padding:7px 16px;border-radius:999px;font-size:13px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .modes button.active{background:var(--paper);color:var(--river-deep);border-color:var(--paper);font-weight:600}
  .diff{display:flex;gap:6px;font-family:ui-sans-serif,system-ui,sans-serif;transition:opacity .2s}
  .diff.off{opacity:.35;pointer-events:none}
  .diff button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#eef0e8;
    padding:5px 13px;border-radius:999px;font-size:12px;cursor:pointer}
  .diff button.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}

  .status{display:flex;align-items:center;justify-content:center;gap:16px;font-family:ui-sans-serif,system-ui,sans-serif;flex-wrap:wrap}
  .player{display:flex;align-items:center;gap:9px;padding:7px 14px;border-radius:999px;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);
    font-size:13px;letter-spacing:.04em;transition:background .25s,border-color .25s}
  .player.active{background:var(--paper);color:var(--river-deep);border-color:var(--paper);font-weight:600}
  .chip{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
  .chip img{width:80%;height:80%;object-fit:contain}
  .chip.cream{background:var(--paper);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .chip.gold{background:linear-gradient(150deg,var(--gold),var(--gold-deep))}
  .score{font-family:"Iowan Old Style",Georgia,serif;font-size:16px;font-weight:600;min-width:12px;text-align:center}
  .vs{opacity:.6;font-size:11px;letter-spacing:.3em}

  .board-wrap{position:relative;padding:clamp(10px,2.6vw,18px);border-radius:20px;
    background:linear-gradient(165deg,var(--river),var(--river-deep));
    box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08)}
  .board{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(6px,1.6vw,12px)}
  .col{display:flex;flex-direction:column;gap:clamp(6px,1.6vw,12px);cursor:pointer}
  .col.full{cursor:not-allowed}
  .col:hover:not(.full) .slot::after{opacity:.5}
  .slot{position:relative;width:clamp(34px,10.2vw,64px);aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #0f2a2c, #0a1e20);
    box-shadow:inset 0 3px 7px rgba(0,0,0,.65);overflow:hidden}
  .slot::after{content:"";position:absolute;inset:14%;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .18s}
  .disc{position:absolute;inset:6%;border-radius:50%;display:grid;place-items:center;overflow:hidden;
    transform:translateY(-640%);animation:drop .44s cubic-bezier(.34,1.3,.5,1) forwards}
  .disc img{width:70%;height:70%;object-fit:contain}
  .disc.cream{background:radial-gradient(circle at 35% 30%, #fbf8f0, #e2d9c4);
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.4),0 0 0 1.5px rgba(20,40,40,.25)}
  .disc.gold{background:radial-gradient(circle at 35% 30%, #dcae4e, #9c7526);
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.4)}
  .disc.win{animation:drop .44s cubic-bezier(.34,1.3,.5,1) forwards, glow 1.1s ease-in-out .44s infinite}
  @keyframes drop{to{transform:translateY(0)}}
  @keyframes glow{0%,100%{box-shadow:inset 0 -3px 6px rgba(0,0,0,.2),0 0 0 0 rgba(198,154,63,0)}
    50%{box-shadow:inset 0 -3px 6px rgba(0,0,0,.2),0 0 0 6px rgba(198,154,63,.6)}}
  .watermark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:.06}
  .watermark img{width:58%;height:auto;filter:brightness(0)}

  .banner{min-height:26px;font-family:"Iowan Old Style",Georgia,serif;font-size:19px;
    text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.25);transition:color .25s}
  .banner.win{color:var(--gold);font-weight:600}
  .controls{display:flex;gap:10px;font-family:ui-sans-serif,system-ui,sans-serif}
  .controls button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#eef0e8;
    padding:9px 18px;border-radius:999px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .controls button:hover{background:var(--paper);color:var(--river-deep);border-color:var(--paper)}
  .controls button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.disc,.disc.win{animation:none!important;transform:none!important}}
</style>
</head>

  let grid,current,over,scores={C:0,G:0};
  let vsMidge=false, difficulty=2, midge='G', busy=false;

  const boardEl=document.getElementById('board');
  const banner=document.getElementById('banner');
  const p1=document.getElementById('p1'),p2=document.getElementById('p2');
  const s1=document.getElementById('s1'),s2=document.getElementById('s2');
  const n2=document.getElementById('n2');
  const label={C:'Cream',G:'Gold'};
  function name(k){ return (vsMidge&&k===midge)?'Midge':label[k]; }

  function build(){
    grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    current='C';over=false;busy=false;boardEl.innerHTML='';
    for(let c=0;c<COLS;c++){
      const col=document.createElement('div');
      col.className='col';col.dataset.col=c;col.setAttribute('role','gridcell');
      for(let r=0;r<ROWS;r++){
        const slot=document.createElement('div');
        slot.className='slot';slot.dataset.row=r;slot.dataset.col=c;
        col.appendChild(slot);
      }
      col.addEventListener('click',()=>{ if(!busy) drop(c,true); });
      boardEl.appendChild(col);
    }
    updateTurn();
  }
  function updateTurn(){
    const cream=current==='C';
    p1.classList.toggle('active',cream&&!over);
    p2.classList.toggle('active',!cream&&!over);
    if(!over){banner.classList.remove('win');banner.textContent=name(current)+' to move';}
  }
  function discEl(kind){
    const d=document.createElement('div');
    d.className='disc '+(kind==='C'?'cream':'gold');
    const im=document.createElement('img');
    im.src=(kind==='C')?CREAM_IMG:GOLD_IMG; im.alt='';
    d.appendChild(im); return d;
  }
  function landingRow(g,c){ for(let r=ROWS-1;r>=0;r--) if(!g[r][c]) return r; return -1; }

  function drop(c,human){
    if(over)return;
    const r=landingRow(grid,c); if(r===-1)return;
    grid[r][c]=current;
    const slot=boardEl.querySelector('.slot[data-row="'+r+'"][data-col="'+c+'"]');
    slot.appendChild(discEl(current));
    if(r===0) boardEl.children[c].classList.add('full');

    const win=checkWin(grid,r,c);
    if(win){ endWin(win); return; }
    if(grid.every(row=>row.every(x=>x))){ over=true;banner.textContent='Draw';banner.classList.add('win');
      p1.classList.remove('active');p2.classList.remove('active');return; }
    current=current==='C'?'G':'C';
    updateTurn();
    if(vsMidge && current===midge && !over){ busy=true; setTimeout(midgeMove,430); }
  }
  function endWin(win){
    over=true;
    win.forEach(([wr,wc])=>{const d=boardEl.querySelector('.slot[data-row="'+wr+'"][data-col="'+wc+'"] .disc');if(d)d.classList.add('win');});
    scores[current]++;s1.textContent=scores.C;s2.textContent=scores.G;
    banner.classList.add('win');banner.textContent=name(current)+' wins';
    p1.classList.remove('active');p2.classList.remove('active');
  }
  function checkWin(g,r,c){
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];const p=g[r][c];
    for(const[dr,dc]of dirs){
      const line=[[r,c]];
      for(let s=1;s<4;s++){const nr=r+dr*s,nc=c+dc*s;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||g[nr][nc]!==p)break;line.push([nr,nc]);}
      for(let s=1;s<4;s++){const nr=r-dr*s,nc=c-dc*s;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||g[nr][nc]!==p)break;line.push([nr,nc]);}
      if(line.length>=4)return line;
    }
    return null;
  }

  /* ---------- Midge AI ---------- */
  function validCols(g){const v=[];for(let c=0;c<COLS;c++)if(landingRow(g,c)!==-1)v.push(c);return v;}
  function tryMove(g,c,p){const r=landingRow(g,c);if(r===-1)return null;const ng=g.map(row=>row.slice());ng[r][c]=p;return{ng,r};}
  function wins(g,r,c){return !!checkWin(g,r,c);}

  function midgeMove(){
    if(over)return;
    const me=midge, opp=(me==='C')?'G':'C';
    let choice;
    const vc=validCols(grid);
    // 1. take a win
    for(const c of vc){const m=tryMove(grid,c,me);if(m&&wins(m.ng,m.r,c)){choice=c;break;}}
    // 2. block opponent win
    if(choice===undefined){for(const c of vc){const m=tryMove(grid,c,opp);if(m&&wins(m.ng,m.r,c)){choice=c;break;}}}
    if(difficulty===1){
      // easy: 55% smart(above), else random
      if(choice===undefined||Math.random()<0.45) choice=vc[Math.floor(Math.random()*vc.length)];
    } else if(choice===undefined){
      if(difficulty===2){ choice=heuristic(vc,me,opp); }
      else { choice=minimaxRoot(me,opp); }
    }
    busy=false;
    drop(choice,false);
  }
  function heuristic(vc,me,opp){
    // prefer center, avoid giving opponent an immediate win on top
    const order=[3,2,4,1,5,0,6].filter(c=>vc.includes(c));
    for(const c of order){
      const m=tryMove(grid,c,me);if(!m)continue;
      const above=tryMove(m.ng,c,opp);
      if(above&&wins(above.ng,above.r,c))continue; // don't set up opp
      return c;
    }
    return order.length?order[0]:vc[0];
  }
  function minimaxRoot(me,opp){
    let best=-1e9,bc=3;const vc=validCols(grid);
    const order=[3,2,4,1,5,0,6].filter(c=>vc.includes(c));
    for(const c of order){
      const m=tryMove(grid,c,me);if(!m)continue;
      if(wins(m.ng,m.r,c))return c;
      const v=minimax(m.ng,4,-1e9,1e9,false,me,opp,c,m.r);
      if(v>best){best=v;bc=c;}
    }
    return bc;
  }
  function minimax(g,depth,a,b,maxing,me,opp,lc,lr){
    if(wins(g,lr,lc)) return maxing? -1000-depth : 1000+depth;
    const vc=validCols(g);
    if(depth===0||vc.length===0) return score(g,me,opp);
    if(maxing){
      let v=-1e9;
      for(const c of vc){const m=tryMove(g,c,me);const val=minimax(m.ng,depth-1,a,b,false,me,opp,c,m.r);
        v=Math.max(v,val);a=Math.max(a,v);if(a>=b)break;}
      return v;
    }else{
      let v=1e9;
      for(const c of vc){const m=tryMove(g,c,opp);const val=minimax(m.ng,depth-1,a,b,true,me,opp,c,m.r);
        v=Math.min(v,val);b=Math.min(b,v);if(a>=b)break;}
      return v;
    }
  }
  function score(g,me,opp){
    let s=0;
    for(let r=0;r<ROWS;r++)if(g[r][3]===me)s+=3;else if(g[r][3]===opp)s-=3;
    const lines=[];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){
        const cells=[];let ok=true;
        for(let k=0;k<4;k++){const nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=ROWS||nc<0||nc>=COLS){ok=false;break;}cells.push(g[nr][nc]);}
        if(ok)lines.push(cells);
      }
    }
    for(const w of lines){
      const m=w.filter(x=>x===me).length,o=w.filter(x=>x===opp).length,e=w.filter(x=>!x).length;
      if(m&&o)continue;
      if(m===3&&e===1)s+=6; else if(m===2&&e===2)s+=2;
      if(o===3&&e===1)s-=8; else if(o===2&&e===2)s-=2;
    }
    return s;
  }

  /* ---------- UI wiring ---------- */
  const mPvP=document.getElementById('mPvP'),mMidge=document.getElementById('mMidge');
  const diffRow=document.getElementById('diffRow');
  function setMode(midgeOn){
    vsMidge=midgeOn;
    mPvP.classList.toggle('active',!midgeOn);
    mMidge.classList.toggle('active',midgeOn);
    diffRow.classList.toggle('off',!midgeOn);
    n2.textContent=midgeOn?'Midge':'Gold';
    build();
  }
  mPvP.addEventListener('click',()=>setMode(false));
  mMidge.addEventListener('click',()=>setMode(true));
  diffRow.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      difficulty=+btn.dataset.d;
      diffRow.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  document.getElementById('reset').addEventListener('click',build);
  document.getElementById('clear').addEventListener('click',()=>{scores={C:0,G:0};s1.textContent='0';s2.textContent='0';build();});

  build();
</script>
